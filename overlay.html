<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

    html,
    body {

      margin: 0;
      width: 100%;
      height: 100%;

      background: transparent;

      overflow: hidden;

    }

    body {

      display: flex;
      align-items: center;
      justify-content: center;

    }

    #timer {

      font-family: Inter, Arial, sans-serif;

      font-weight: 900;

      font-size: 150px;

      line-height: 1;

      white-space: nowrap;

      background: white;

      color: transparent;

      background-clip: text;
      -webkit-background-clip: text;

      -webkit-text-fill-color: transparent;

      filter:
        drop-shadow(0 4px 8px rgba(0,0,0,.5));

    }

  </style>

</head>

<body>

<div id="timer">10:00</div>


<script>

const SUPABASE_URL =
  "https://hkqieahernxlupambubz.supabase.co";

/*
  PASTE THE SAME SUPABASE PUBLISHABLE KEY HERE.
*/
const SUPABASE_KEY =
  "sb_publishable_Ueiqs7cgDOi13Qj9rVL_9g_AfvCB9ht";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const params =
  new URLSearchParams(
    window.location.search
  );


const paintInput =
  params.get("paint") || "";

const font =
  params.get("font") || "Inter";

const size =
  params.get("size") || "150";


const timer =
  document.getElementById("timer");


timer.style.fontFamily =
  `"${font}", Inter, Arial, sans-serif`;

timer.style.fontSize =
  size + "px";


let timerState = {
  remaining_ms: 600000,
  running: false,
  updated_at: new Date().toISOString()
};


function getRemaining() {

  if (!timerState.running) {
    return Number(timerState.remaining_ms);
  }

  const updated =
    new Date(timerState.updated_at).getTime();

  const elapsed =
    Date.now() - updated;

  return Math.max(
    0,
    Number(timerState.remaining_ms) - elapsed
  );
}


function formatTime(ms) {

  const totalSeconds =
    Math.ceil(ms / 1000);

  const minutes =
    Math.floor(totalSeconds / 60);

  const seconds =
    totalSeconds % 60;

  return (
    String(minutes).padStart(2, "0") +
    ":" +
    String(seconds).padStart(2, "0")
  );
}


function applyPaint(url) {

  if (!url) {

    timer.style.background =
      "white";

    return;
  }

  /*
    A direct 7TV Paint image URL.
  */

  if (
    url.startsWith("http://") ||
    url.startsWith("https://")
  ) {

    timer.style.backgroundImage =
      `url("${url}")`;

    timer.style.backgroundSize =
      "cover";

    timer.style.backgroundPosition =
      "center";

    timer.style.backgroundRepeat =
      "no-repeat";

    return;
  }

  /*
    Try to resolve a 7TV Paint ID.
  */

  fetch(
    "https://7tv.io/v3/cosmetics"
  )
    .then(r => r.json())
    .then(data => {

      let paint = null;

      if (Array.isArray(data)) {

        paint =
          data.find(
            x => x.id === url
          );

      }

      if (!paint) return;

      if (
        paint.function === "URL" &&
        paint.image_url
      ) {

        timer.style.backgroundImage =
          `url("${paint.image_url}")`;

        timer.style.backgroundSize =
          "cover";

        timer.style.backgroundPosition =
          "center";

      }

    })
    .catch(err => {

      console.error(
        "7TV Paint error:",
        err
      );

    });

}


async function loadTimer() {

  const { data, error } =
    await supabaseClient
      .from("timers")
      .select("*")
      .eq("id", "main")
      .single();

  if (data) {

    timerState = data;

  }

}


supabaseClient
  .channel("timer-sync")
  .on(
    "postgres_changes",
    {
      event: "*",
      schema: "public",
      table: "timers",
      filter: "id=eq.main"
    },
    payload => {

      if (payload.new) {

        timerState =
          payload.new;

      }

    }
  )
  .subscribe();


applyPaint(paintInput);

loadTimer();


function updateDisplay() {

  const remaining =
    getRemaining();

  timer.textContent =
    formatTime(remaining);

}


setInterval(
  updateDisplay,
  100
);

updateDisplay();

</script>

</body>
</html>
