<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>GD0TTY'S TIMER</title>

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: transparent !important;

    overflow: hidden;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

#timer {
    display: inline-block;

    font-size: 120px;
    line-height: 1;

    font-weight: 900;

    white-space: nowrap;
    text-align: center;

    color: white;

    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;

    -webkit-background-clip: text;
    background-clip: text;
}

</style>
</head>

<body>

<div id="timer">10:00</div>

<script>

const params = new URLSearchParams(
    window.location.search
);

const paintId =
    params.get("paint");

const start =
    params.get("start") || "10:00";

const size =
    params.get("size") || "120";

const font =
    params.get("font") || "Roboto";

const timer =
    document.getElementById("timer");

// --- AUDIO SYSTEM SETUP ---
let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
            audioCtx = new AudioContext();
        }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

// User interaction listener to satisfy browser autoplay policies
window.addEventListener('click', initAudio, { once: true });

function playEndSound() {
    initAudio();
    if (!audioCtx) return;

    // Futuristic synth finish chime: C5 -> G5 -> C6
    const notes = [523.25, 783.99, 1046.50];

    notes.forEach((freq, index) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "sine";
        osc.frequency.value = freq;

        const startTime = audioCtx.currentTime + (index * 0.12);
        const duration = 0.5;

        gain.gain.setValueAtTime(0.3, startTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(startTime);
        osc.stop(startTime + duration);
    });
}
// --- END AUDIO SYSTEM ---

const fontEncoded =
    font
        .trim()
        .replace(/\s+/g, "+");

const fontLink =
    document.createElement("link");

fontLink.rel = "stylesheet";

fontLink.href =
    "https://fonts.googleapis.com/css2?family=" +
    fontEncoded +
    ":wght@100;200;300;400;500;600;700;800;900&display=swap";

document.head.appendChild(fontLink);

timer.style.fontFamily =
    `"${font}", sans-serif`;

timer.style.fontSize =
    size + "px";

const SEVENTV_API =
    "https://7tv.io/v4/gql";

const PAINT_QUERY = `
query {
    paints {
        paints {
            id
            name

            data {
                layers {
                    id
                    opacity

                    ty {

                        __typename

                        ... on PaintLayerTypeSingleColor {

                            color {
                                r
                                g
                                b
                                a
                                hex
                            }

                        }

                        ... on PaintLayerTypeLinearGradient {

                            angle
                            repeating

                            stops {
                                at

                                color {
                                    r
                                    g
                                    b
                                    a
                                    hex
                                }
                            }

                        }

                        ... on PaintLayerTypeRadialGradient {

                            repeating
                            shape

                            stops {
                                at

                                color {
                                    r
                                    g
                                    b
                                    a
                                    hex
                                }
                            }

                        }

                        ... on PaintLayerTypeImage {

                            images {
                                url
                                width
                                height
                                mime
                                frameCount
                            }

                        }

                    }
                }

                shadows {

                    blur
                    offsetX
                    offsetY

                    color {
                        r
                        g
                        b
                        a
                        hex
                    }

                }
            }
        }
    }
}
`;

function colorToCss(color) {

    if (!color) {
        return "rgba(255,255,255,1)";
    }

    const r =
        color.r ?? 255;

    const g =
        color.g ?? 255;

    const b =
        color.b ?? 255;

    const a =
        color.a ?? 1;

    return `rgba(${r},${g},${b},${a})`;
}

function convertPaintLayer(layer) {

    if (!layer || !layer.ty) {
        return null;
    }

    const type =
        layer.ty.__typename;

    const opacity =
        layer.opacity ?? 1;

    if (
        type ===
        "PaintLayerTypeSingleColor"
    ) {

        const color =
            colorToCss(
                layer.ty.color
            );

        return {
            image: `linear-gradient(${color},${color})`,
            size: "100% 100%",
            repeat: "no-repeat",
            opacity
        };
    }

    if (
        type ===
        "PaintLayerTypeLinearGradient"
    ) {

        const stops =
            (layer.ty.stops || [])
                .map(stop => {

                    return (
                        colorToCss(stop.color) +
                        " " +
                        (stop.at * 100) +
                        "%"
                    );

                })
                .join(",");

        const angle =
            layer.ty.angle ?? 0;

        return {
            image:
                `linear-gradient(${angle}deg,${stops})`,
            size: "100% 100%",
            repeat:
                layer.ty.repeating
                    ? "repeat"
                    : "no-repeat",
            opacity
        };
    }

    if (
        type ===
        "PaintLayerTypeRadialGradient"
    ) {

        const stops =
            (layer.ty.stops || [])
                .map(stop => {

                    return (
                        colorToCss(stop.color) +
                        " " +
                        (stop.at * 100) +
                        "%"
                    );

                })
                .join(",");

        return {
            image:
                `radial-gradient(circle,${stops})`,
            size: "100% 100%",
            repeat:
                layer.ty.repeating
                    ? "repeat"
                    : "no-repeat",
            opacity
        };
    }

    if (
        type ===
        "PaintLayerTypeImage"
    ) {

        const images =
            layer.ty.images || [];

        if (!images.length) {
            return null;
        }

        const image =
            images.reduce(
                (best, current) => {

                    return (
                        (current.frameCount || 1) >
                        (best.frameCount || 1)
                    )
                        ? current
                        : best;

                },
                images[0]
            );

        if (!image.url) {
            return null;
        }

        return {
            image:
                `url("${image.url}")`,
            size: "cover",
            repeat: "no-repeat",
            opacity
        };
    }

    return null;
}

async function loadPaint() {

    if (!paintId) {
        return;
    }

    try {

        const response =
            await fetch(
                SEVENTV_API,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        query:
                            PAINT_QUERY
                    })
                }
            );

        if (!response.ok) {
            throw new Error(
                "7TV API request failed"
            );
        }

        const result =
            await response.json();

        const paints =
            result
                ?.data
                ?.paints
                ?.paints || [];

        const paint =
            paints.find(
                p =>
                    p.id === paintId
            );

        if (!paint) {

            console.error(
                "Paint not found:",
                paintId
            );

            return;
        }

        const layers =
            paint
                ?.data
                ?.layers || [];

        const backgrounds = [];

        const sizes = [];
        const repeats = [];

        for (
            const layer of layers
        ) {

            const converted =
                convertPaintLayer(
                    layer
                );

            if (!converted) {
                continue;
            }

            backgrounds.push(
                converted.image
            );

            sizes.push(
                converted.size
            );

            repeats.push(
                converted.repeat
            );
        }

        if (backgrounds.length) {

            timer.style.backgroundImage =
                backgrounds.join(",");

            timer.style.backgroundSize =
                sizes.join(",");

            timer.style.backgroundRepeat =
                repeats.join(",");

            timer.style.color =
                "transparent";

            timer.style.webkitTextFillColor =
                "transparent";

        }

    }

    catch (error) {

        console.error(
            "Could not load 7TV Paint:",
            error
        );

        timer.style.color =
            "white";

        timer.style.webkitTextFillColor =
            "white";
    }
}

function parseTime(value) {

    const parts =
        value
            .split(":")
            .map(Number);

    if (parts.length === 2) {

        return (
            (parts[0] * 60) +
            parts[1]
        );
    }

    if (parts.length === 3) {

        return (
            (parts[0] * 3600) +
            (parts[1] * 60) +
            parts[2]
        );
    }

    return 0;
}

function formatTime(seconds) {

    seconds =
        Math.max(
            0,
            Math.floor(seconds)
        );

    const hours =
        Math.floor(
            seconds / 3600
        );

    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );

    const secs =
        seconds % 60;

    if (hours > 0) {

        return (
            String(hours)
                .padStart(2, "0") +
            ":" +
            String(minutes)
                .padStart(2, "0") +
            ":" +
            String(secs)
                .padStart(2, "0")
        );
    }

    return (
        String(minutes)
            .padStart(2, "0") +
        ":" +
        String(secs)
            .padStart(2, "0")
    );
}

let remaining =
    parseTime(start);

let last =
    performance.now();

let hasPlayedSound = false;

function update() {

    const now =
        performance.now();

    const delta =
        (now - last) / 1000;

    last =
        now;

    if (remaining > 0) {

        remaining -= delta;

        if (remaining <= 0) {
            remaining = 0;
            if (!hasPlayedSound) {
                playEndSound();
                hasPlayedSound = true;
            }
        }
    }

    timer.textContent =
        formatTime(remaining);

    requestAnimationFrame(
        update
    );
}

loadPaint();

update();

</script>

</body>
</html>
