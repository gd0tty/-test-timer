<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:transparent !important;
    overflow:hidden;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

#timer{
    font-family:Arial,sans-serif;
    font-weight:900;
    line-height:1;
    white-space:nowrap;

    background-clip:text;
    -webkit-background-clip:text;

    color:transparent;
    -webkit-text-fill-color:transparent;

    background-repeat:no-repeat;
    background-position:center;
}

#error{
    position:fixed;
    left:50%;
    bottom:10px;
    transform:translateX(-50%);

    font-family:Arial,sans-serif;
    font-size:14px;

    color:white;
    background:rgba(0,0,0,.75);

    padding:8px 12px;
    border-radius:7px;

    display:none;
}
</style>
</head>

<body>

<div id="timer">10</div>
<div id="error"></div>

<script>

const API =
    "https://api.7tv.dev/v3/gql";

const params =
    new URLSearchParams(window.location.search);

const paintId =
    params.get("paint") || "";

const startTime =
    Date.now();

const duration =
    Math.max(
        1,
        parseInt(params.get("time") || "10")
    );

const fontSize =
    Math.max(
        10,
        parseInt(params.get("size") || "120")
    );

const font =
    params.get("font") || "Arial";

const timer =
    document.getElementById("timer");

const errorBox =
    document.getElementById("error");

timer.style.fontSize =
    `${fontSize}px`;

timer.style.fontFamily =
    font;

function showError(message){

    errorBox.textContent = message;
    errorBox.style.display = "block";

}

const paintQuery = `
query {
    paints {
        paints {
            id
            name
            data {
                layers {
                    id
                    opacity
                    ty {
                        __typename

                        ... on PaintLayerTypeSingleColor {
                            color {
                                r
                                g
                                b
                                a
                                hex
                            }
                        }

                        ... on PaintLayerTypeLinearGradient {
                            angle
                            repeating
                            stops {
                                at
                                color {
                                    r
                                    g
                                    b
                                    a
                                    hex
                                }
                            }
                        }

                        ... on PaintLayerTypeRadialGradient {
                            repeating
                            shape
                            stops {
                                at
                                color {
                                    r
                                    g
                                    b
                                    a
                                    hex
                                }
                            }
                        }

                        ... on PaintLayerTypeImage {
                            images {
                                url
                                width
                                height
                                mime
                            }
                        }
                    }
                }

                shadows {
                    blur
                    offsetX
                    offsetY
                    color {
                        r
                        g
                        b
                        a
                        hex
                    }
                }
            }
        }
    }
}
`;

function rgba(color,opacity=1){

    if(!color){
        return "rgba(255,255,255,1)";
    }

    const a =
        typeof color.a === "number"
            ? color.a / 255
            : 1;

    return `rgba(
        ${color.r || 0},
        ${color.g || 0},
        ${color.b || 0},
        ${Math.max(0,Math.min(1,a * opacity))}
    )`;
}

function layerToCSS(layer){

    const opacity =
        typeof layer.opacity === "number"
            ? layer.opacity
            : 1;

    const type =
        layer.ty;

    if(!type) return null;

    if(type.__typename === "PaintLayerTypeSingleColor"){

        const c =
            rgba(type.color,opacity);

        return {
            image:`linear-gradient(${c},${c})`,
            size:"100% 100%",
            repeat:"no-repeat"
        };
    }

    if(type.__typename === "PaintLayerTypeLinearGradient"){

        const stops =
            (type.stops || [])
                .map(stop =>
                    `${rgba(stop.color,opacity)} ${stop.at * 100}%`
                )
                .join(",");

        const fn =
            type.repeating
                ? "repeating-linear-gradient"
                : "linear-gradient";

        return {
            image:`${fn}(${type.angle || 0}deg,${stops})`,
            size:"100% 100%",
            repeat:"no-repeat"
        };
    }

    if(type.__typename === "PaintLayerTypeRadialGradient"){

        const stops =
            (type.stops || [])
                .map(stop =>
                    `${rgba(stop.color,opacity)} ${stop.at * 100}%`
                )
                .join(",");

        const fn =
            type.repeating
                ? "repeating-radial-gradient"
                : "radial-gradient";

        const shape =
            type.shape === "ELLIPSE"
                ? "ellipse"
                : "circle";

        return {
            image:`${fn}(${shape},${stops})`,
            size:"100% 100%",
            repeat:"no-repeat"
        };
    }

    if(type.__typename === "PaintLayerTypeImage"){

        const image =
            type.images &&
            type.images.length
                ? type.images[0]
                : null;

        if(!image) return null;

        return {
            image:`url("${image.url}")`,
            size:"cover",
            repeat:"no-repeat"
        };
    }

    return null;
}

function applyPaint(paint){

    const layers =
        paint?.data?.layers || [];

    const rendered =
        layers
            .map(layerToCSS)
            .filter(Boolean);

    timer.style.backgroundImage =
        rendered.length
            ? rendered.map(x=>x.image).join(",")
            : "none";

    timer.style.backgroundSize =
        rendered.length
            ? rendered.map(x=>x.size).join(",")
            : "100% 100%";

    timer.style.backgroundRepeat =
        rendered.length
            ? rendered.map(x=>x.repeat).join(",")
            : "no-repeat";

    timer.style.backgroundPosition =
        rendered.length
            ? rendered.map(()=> "center").join(",")
            : "center";

    const shadows =
        paint?.data?.shadows || [];

    if(shadows.length){

        timer.style.filter =
            shadows.map(shadow =>
                `drop-shadow(
                    ${shadow.offsetX || 0}px
                    ${shadow.offsetY || 0}px
                    ${shadow.blur || 0}px
                    ${rgba(shadow.color)}
                )`
            ).join(" ");

    }else{

        timer.style.filter =
            "none";
    }
}

async function loadPaint(){

    if(!paintId){

        showError("No 7TV Paint ID.");
        return;
    }

    try{

        const response =
            await fetch(API,{
                method:"POST",
                headers:{
                    "Content-Type":"application/json",
                    "Accept":"application/json"
                },
                body:JSON.stringify({
                    query:paintQuery
                })
            });

        if(!response.ok){

            throw new Error(
                `7TV API HTTP ${response.status}`
            );
        }

        const json =
            await response.json();

        if(json.errors?.length){

            throw new Error(
                json.errors
                    .map(e=>e.message)
                    .join(", ")
            );
        }

        const paints =
            json?.data?.paints?.paints || [];

        const paint =
            paints.find(
                p =>
                    String(p.id).toLowerCase()
                    === String(paintId).toLowerCase()
            );

        if(!paint){

            throw new Error(
                "Paint ID not found"
            );
        }

        applyPaint(paint);

    }catch(error){

        console.error(error);

        showError(
            "7TV Paint failed to load"
        );

        

        timer.style.backgroundImage =
            "linear-gradient(white,white)";
    }
}

function updateTimer(){

    const elapsed =
        Math.floor(
            (Date.now() - startTime) / 1000
        );

    const remaining =
        Math.max(
            0,
            duration - elapsed
        );

    timer.textContent =
        remaining;

    if(remaining <= 0){

        clearInterval(interval);
    }
}

loadPaint();

updateTimer();

const interval =
    setInterval(
        updateTimer,
        250
    );

</script>

</body>
</html>
