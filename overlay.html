<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

<title>GD0TTY'S TIMER</title>

<style>

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: transparent !important;

    overflow: hidden;
}

body {

    display: flex;

    align-items: center;

    justify-content: center;
}

#timer {

    display: inline-block;

    font-size: 120px;

    line-height: 1;

    font-weight: 900;

    white-space: nowrap;

    text-align: center;

    color: white;

    -webkit-text-fill-color: white;

    background-repeat: no-repeat;

    background-position: center;

    background-size: cover;

    -webkit-background-clip: text;

    background-clip: text;
}

</style>

</head>

<body>

<div id="timer">
10:00
</div>

<script>

const params =
    new URLSearchParams(
        window.location.search
    );


const paintId =
    params.get("paint");


const start =
    params.get("start") ||
    "10:00";


const size =
    params.get("size") ||
    "120";


const font =
    params.get("font") ||
    "Roboto";


const timer =
    document.getElementById(
        "timer"
    );




const fontLink =
    document.createElement("link");


fontLink.rel =
    "stylesheet";


fontLink.href =
    "https://fonts.googleapis.com/css2?family=" +
    encodeURIComponent(font)
        .replace(/%20/g, "+") +
    ":wght@100;200;300;400;500;600;700;800;900&display=swap";


document.head.appendChild(
    fontLink
);


timer.style.fontFamily =
    `"${font}", sans-serif`;


timer.style.fontSize =
    size + "px";




const SEVENTV_GRAPHQL =
    "https://7tv.io/v3/gql";


async function sevenTVRequest(query) {

    const response =
        await fetch(
            SEVENTV_GRAPHQL,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json",

                    "Accept":
                        "application/json"
                },

                body: JSON.stringify({
                    query: query
                })
            }
        );


    if (!response.ok) {

        throw new Error(
            "7TV API returned " +
            response.status
        );

    }


    const json =
        await response.json();


    if (json.errors) {

        console.error(
            json.errors
        );

        throw new Error(
            "7TV GraphQL error"
        );

    }


    return json.data;
}



function colorToCSS(color, opacity = 1) {

    if (!color) {

        return "rgba(255,255,255,1)";

    }


    if (typeof color === "string") {

        return color;

    }


    const r =
        Number(color.r || 0);


    const g =
        Number(color.g || 0);


    const b =
        Number(color.b || 0);


    const a =
        Number(color.a ?? 255) / 255;


    return (
        `rgba(${r},${g},${b},${a * opacity})`
    );
}




function makeStops(stops, opacity = 1) {

    if (!Array.isArray(stops)) {
        return "";
    }


    return stops
        .map(stop => {

            const color =
                colorToCSS(
                    stop.color,
                    opacity
                );


            const position =
                Number(stop.at || 0) * 100;


            return (
                `${color} ${position}%`
            );

        })
        .join(", ");
}



function layerToCSS(layer) {

    if (!layer || !layer.ty) {
        return null;
    }


    const type =
        layer.ty;


    const opacity =
        Number(
            layer.opacity ?? 1
        );


    if (
        type.__typename ===
        "PaintLayerTypeSingleColor"
    ) {

        return {
            css:
                `linear-gradient(` +
                `rgba(0,0,0,0),` +
                `${colorToCSS(type.color, opacity)}` +
                `)`,

            opacity: 1
        };

    }


    if (
        type.__typename ===
        "PaintLayerTypeLinearGradient"
    ) {

        const stops =
            makeStops(
                type.stops,
                opacity
            );


        if (!stops) {
            return null;
        }


        const prefix =
            type.repeating
                ? "repeating-"
                : "";


        return {
            css:
                `${prefix}linear-gradient(` +
                `${type.angle || 0}deg,` +
                `${stops})`,

            opacity: 1
        };

    }


    if (
        type.__typename ===
        "PaintLayerTypeRadialGradient"
    ) {

        const stops =
            makeStops(
                type.stops,
                opacity
            );


        if (!stops) {
            return null;
        }


        const prefix =
            type.repeating
                ? "repeating-"
                : "";


        const shape =
            String(
                type.shape || "CIRCLE"
            ).toLowerCase();


        return {
            css:
                `${prefix}radial-gradient(` +
                `${shape}, ${stops})`,

            opacity: 1
        };

    }


    if (
        type.__typename ===
        "PaintLayerTypeImage"
    ) {

        if (
            !Array.isArray(type.images) ||
            !type.images.length
        ) {

            return null;

        }


        const image =
            type.images[0];


        if (!image || !image.url) {
            return null;
        }


        return {
            css:
                `url("${image.url}")`,

            opacity: opacity
        };

    }


    return null;
}




function applyPaint(paint) {

    if (
        !paint ||
        !paint.data ||
        !Array.isArray(
            paint.data.layers
        )
    ) {

        return false;

    }


    const backgrounds = [];


    [...paint.data.layers]
        .reverse()
        .forEach(layer => {

            const result =
                layerToCSS(layer);


            if (result) {

                backgrounds.push(
                    result.css
                );

            }

        });


    if (!backgrounds.length) {
        return false;
    }


    timer.style.backgroundImage =
        backgrounds.join(", ");


    timer.style.backgroundSize =
        backgrounds
            .map(() => "cover")
            .join(", ");


    timer.style.backgroundPosition =
        backgrounds
            .map(() => "center")
            .join(", ");


    timer.style.backgroundRepeat =
        backgrounds
            .map(() => "no-repeat")
            .join(", ");


    timer.style.color =
        "transparent";


    timer.style.webkitTextFillColor =
        "transparent";


    if (
        Array.isArray(
            paint.data.shadows
        )
    ) {

        timer.style.textShadow =
            paint.data.shadows
                .map(shadow => {

                    return (
                        `${shadow.offsetX || 0}px ` +
                        `${shadow.offsetY || 0}px ` +
                        `${shadow.blur || 0}px ` +
                        `${colorToCSS(shadow.color)}`
                    );

                })
                .join(", ");

    }


    return true;
}




async function loadPaint() {

    if (!paintId) {
        return;
    }


    try {

        const query = `

            {
                paints {
                    paints {

                        id
                        name

                        data {

                            layers {

                                id
                                opacity

                                ty {

                                    __typename

                                    ... on PaintLayerTypeSingleColor {

                                        color {
                                            r
                                            g
                                            b
                                            a
                                            hex
                                        }

                                    }

                                    ... on PaintLayerTypeLinearGradient {

                                        angle
                                        repeating

                                        stops {

                                            at

                                            color {
                                                r
                                                g
                                                b
                                                a
                                                hex
                                            }

                                        }

                                    }

                                    ... on PaintLayerTypeRadialGradient {

                                        repeating
                                        shape

                                        stops {

                                            at

                                            color {
                                                r
                                                g
                                                b
                                                a
                                                hex
                                            }

                                        }

                                    }

                                    ... on PaintLayerTypeImage {

                                        images {
                                            url
                                            width
                                            height
                                            mime
                                        }

                                    }

                                }

                            }

                            shadows {

                                blur
                                offsetX
                                offsetY

                                color {
                                    r
                                    g
                                    b
                                    a
                                    hex
                                }

                            }

                        }

                    }
                }
            }

        `;


        const data =
            await sevenTVRequest(
                query
            );


        const paints =
            data?.paints?.paints;


        if (!Array.isArray(paints)) {

            throw new Error(
                "No paints returned."
            );

        }


        const paint =
            paints.find(
                item =>
                    String(item.id) ===
                    String(paintId)
            );


        if (!paint) {

            throw new Error(
                "Paint ID not found."
            );

        }


        if (!applyPaint(paint)) {

            throw new Error(
                "Paint could not be rendered."
            );

        }

    } catch (error) {

        console.error(
            "7TV Paint error:",
            error
        );

    }
}



function parseTime(value) {

    const parts =
        value
            .split(":")
            .map(Number);


    if (parts.length === 2) {

        return (
            parts[0] * 60 +
            parts[1]
        );

    }


    if (parts.length === 3) {

        return (
            parts[0] * 3600 +
            parts[1] * 60 +
            parts[2]
        );

    }


    return 0;
}


function formatTime(seconds) {

    seconds =
        Math.max(
            0,
            Math.floor(seconds)
        );


    const hours =
        Math.floor(
            seconds / 3600
        );


    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );


    const secs =
        seconds % 60;


    if (hours > 0) {

        return (
            String(hours).padStart(2, "0") +
            ":" +
            String(minutes).padStart(2, "0") +
            ":" +
            String(secs).padStart(2, "0")
        );

    }


    return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(secs).padStart(2, "0")
    );
}


let remaining =
    parseTime(start);


let last =
    performance.now();


function update() {

    const now =
        performance.now();


    const delta =
        (now - last) / 1000;


    last =
        now;


    if (remaining > 0) {

        remaining -= delta;


        if (remaining < 0) {
            remaining = 0;
        }

    }


    timer.textContent =
        formatTime(
            remaining
        );


    requestAnimationFrame(
        update
    );
}




loadPaint();

update();

</script>

</body>
</html>
