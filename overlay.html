<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Timer Overlay</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #timer {
        display: inline-block;
        position: relative;

        font-family: Arial, sans-serif;
        font-weight: 900;
        font-size: 120px;
        line-height: 1;

        white-space: nowrap;

        /*
        The Paint is applied to the ENTIRE timer.
        */
        background-image: var(--paint);
        background-repeat: no-repeat;
        background-size: 100% 100%;
        background-position: center;

        /*
        Makes the Paint visible ONLY through the timer text.
        No rectangle.
        */
        -webkit-background-clip: text;
        background-clip: text;

        color: transparent;
        -webkit-text-fill-color: transparent;
    }
</style>
</head>

<body>

<div id="timer">00:00</div>

<script>

const params = new URLSearchParams(window.location.search);

const paintUrl = params.get("paint");
const startValue = params.get("start") || "00:00";
const size = params.get("size") || "120";


/* Timer size */
document.getElementById("timer").style.fontSize = size + "px";


/*
ONE Paint URL for the WHOLE timer.
*/
if (paintUrl) {
    document.getElementById("timer").style.setProperty(
        "--paint",
        `url("${paintUrl}")`
    );
}


/* Convert starting time into seconds */
function parseTime(value) {

    const parts = value.split(":").map(Number);

    if (parts.length === 2) {
        return (parts[0] * 60) + parts[1];
    }

    if (parts.length === 3) {
        return (
            (parts[0] * 3600) +
            (parts[1] * 60) +
            parts[2]
        );
    }

    return 0;
}


let elapsed = parseTime(startValue);
let lastTime = Date.now();


/* Format timer */
function formatTime(seconds) {

    seconds = Math.floor(seconds);

    const hours = Math.floor(seconds / 3600);

    const minutes = Math.floor((seconds % 3600) / 60);

    const secs = seconds % 60;


    if (hours > 0) {

        return (
            String(hours).padStart(2, "0") +
            ":" +
            String(minutes).padStart(2, "0") +
            ":" +
            String(secs).padStart(2, "0")
        );

    }


    return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(secs).padStart(2, "0")
    );
}


/* Run timer */
function updateTimer() {

    const now = Date.now();

    elapsed += (now - lastTime) / 1000;

    lastTime = now;

    document.getElementById("timer").textContent =
        formatTime(elapsed);

    requestAnimationFrame(updateTimer);
}


updateTimer();

</script>

</body>
</html>
