<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<style>

html, body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: transparent;

    overflow: hidden;
}


body {

    display: flex;

    justify-content: center;

    align-items: center;

}


/*
========================================
TIMER
========================================
*/

#timer {

    font-family: Arial, sans-serif;

    font-weight: 900;

    text-align: center;

    white-space: nowrap;


    /*
    Paint gets clipped INTO the letters
    */

    background-image: var(--paint);

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;


    -webkit-background-clip: text;

    background-clip: text;


    color: transparent;

    -webkit-text-fill-color: transparent;


    filter:
        drop-shadow(0 0 3px black)
        drop-shadow(0 0 8px black);

}

</style>

</head>


<body>

<div id="timer">00:00</div>


<script>


/*
========================================
GET SETTINGS FROM URL
========================================
*/

const params =
    new URLSearchParams(
        window.location.search
    );


const paint =
    params.get("paint");


const size =
    Number(params.get("size")) || 100;


let elapsed =
    Number(params.get("start")) || 0;


/*
========================================
APPLY PAINT
========================================
*/

if (paint) {

    document.documentElement.style
        .setProperty(
            "--paint",
            `url("${paint}")`
        );

}


/*
========================================
SIZE
========================================
*/

document.getElementById("timer")
    .style.fontSize =
        size + "px";


/*
========================================
TIMER
========================================
*/

let paused = false;


function update() {

    if (!paused) {

        elapsed++;

    }


    if (elapsed < 0) {

        elapsed = 0;

    }


    const minutes =
        Math.floor(elapsed / 60);


    const seconds =
        elapsed % 60;


    document.getElementById("timer")
        .textContent =

        String(minutes)
            .padStart(2, "0")

        + ":" +

        String(seconds)
            .padStart(2, "0");

}


update();


setInterval(
    update,
    1000
);


/*
========================================
CONTROLS
========================================
*/

window.timerControls = {

    pause: function() {

        paused = true;

    },


    resume: function() {

        paused = false;

    },


    reset: function() {

        elapsed = 0;

    },


    add: function(seconds) {

        elapsed +=
            Number(seconds) || 0;

    },


    remove: function(seconds) {

        elapsed -=
            Number(seconds) || 0;


        if (elapsed < 0) {

            elapsed = 0;

        }

    },


    set: function(time) {

        const parts =
            String(time).split(":");


        if (parts.length === 2) {

            const minutes =
                Number(parts[0]) || 0;

            const seconds =
                Number(parts[1]) || 0;


            elapsed =
                (minutes * 60) + seconds;

        }

    }

};

</script>

</body>

</html>
