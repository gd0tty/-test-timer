<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Timer Overlay</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #timer {
        display: inline-block;

        font-family: Arial, Helvetica, sans-serif;
        font-weight: 900;

        font-size: 120px;
        line-height: 1;

        white-space: nowrap;

        /*
        THE ONE PAINT URL IS APPLIED TO
        THE WHOLE TIMER.
        */

        background-image: var(--paint);
        background-repeat: no-repeat;
        background-position: center;
        background-size: 100% 100%;

        /*
        THIS IS WHAT PREVENTS THE
        RECTANGLE FROM SHOWING.
        */

        -webkit-background-clip: text;
        background-clip: text;

        color: transparent;
        -webkit-text-fill-color: transparent;
    }
</style>
</head>

<body>

<div id="timer">00:00</div>

<script>

const params = new URLSearchParams(window.location.search);

const paint = params.get("paint");
const start = params.get("start") || "00:00";
const size = params.get("size") || "120";

const timer = document.getElementById("timer");


/* Timer size */
timer.style.fontSize = size + "px";


/*
    ONE Paint URL.

    It applies to the ENTIRE timer,
    NOT individual digits.
*/

if (paint) {
    timer.style.setProperty(
        "--paint",
        `url("${paint.replace(/"/g, '\\"')}")`
    );
}


/* Convert starting time to seconds */

function parseTime(value) {

    const parts = value.split(":").map(Number);

    if (parts.length === 2) {
        return (parts[0] * 60) + parts[1];
    }

    if (parts.length === 3) {
        return (
            (parts[0] * 3600) +
            (parts[1] * 60) +
            parts[2]
        );
    }

    return 0;
}


let elapsed = parseTime(start);

let lastTime = performance.now();


/* Format timer */

function formatTime(seconds) {

    seconds = Math.floor(seconds);

    const hours = Math.floor(seconds / 3600);

    const minutes =
        Math.floor((seconds % 3600) / 60);

    const secs =
        seconds % 60;


    if (hours > 0) {

        return (
            String(hours).padStart(2, "0") +
            ":" +
            String(minutes).padStart(2, "0") +
            ":" +
            String(secs).padStart(2, "0")
        );

    }


    return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(secs).padStart(2, "0")
    );
}


/* Run timer */

function update() {

    const now = performance.now();

    elapsed += (now - lastTime) / 1000;

    lastTime = now;

    timer.textContent = formatTime(elapsed);

    requestAnimationFrame(update);
}


update();

</script>

</body>
</html>
