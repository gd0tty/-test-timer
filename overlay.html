<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timer Overlay</title>
<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
}

.timer {
    font-size: 120px;
    font-weight: 900;
    line-height: 1;
    white-space: nowrap;
    text-align: center;
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;
    -webkit-background-clip: text;
    background-clip: text;
    color: white;
}

#ytHiddenContainer {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    left: -9999px;
    top: -9999px;
}
</style>
<script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

<div class="timer" id="timer">00:00</div>

<div id="ytHiddenContainer">
    <div id="ytPlayer"></div>
</div>

<script>
const SEVENTV_API = "https://7tv.io/v4/gql";

const PAINT_QUERY = `
query {
    paints {
        paints {
            id
            name
            data {
                layers {
                    id
                    opacity
                    ty {
                        __typename
                        ... on PaintLayerTypeSingleColor {
                            color { r g b a hex }
                        }
                        ... on PaintLayerTypeLinearGradient {
                            angle repeating stops { at color { r g b a hex } }
                        }
                        ... on PaintLayerTypeRadialGradient {
                            repeating shape stops { at color { r g b a hex } }
                        }
                        ... on PaintLayerTypeImage {
                            images { url width height mime frameCount }
                        }
                    }
                }
                shadows {
                    blur offsetX offsetY color { r g b a hex }
                }
            }
        }
    }
}
`;

const timerEl = document.getElementById("timer");


const params = new URLSearchParams(window.location.search);
const paintParam = params.get("paint") || "";
const fontParam = params.get("font") || "Roboto";
const startParam = params.get("start") || "10:00";
const sizeParam = params.get("size") || "120";
const soundParam = params.get("sound") || "none";
const customSoundParam = params.get("customSound") || "";
const volumeParam = parseFloat(params.get("volume") || "1");

let audioCtx = null;
let ytPlayer = null;
let isYtReady = false;
let soundPlayed = false;


function setupStyles() {
    if (fontParam) {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = "https://fonts.googleapis.com/css2?family=" + fontParam.replace(/\s+/g, "+") + ":wght@100;200;300;400;500;600;700;800;900&display=swap";
        document.head.appendChild(link);
        timerEl.style.fontFamily = `"${fontParam}", sans-serif`;
    }
    if (sizeParam) {
        timerEl.style.fontSize = sizeParam + "px";
    }
}


function extractPaintId(value) {
    value = String(value || "").trim();
    if (!value) return "";
    if (/^[A-Za-z0-9]+$/.test(value)) return value;
    try {
        const url = new URL(value);
        const parts = url.pathname.split("/").filter(Boolean);
        if (parts.length) {
            const last = parts[parts.length - 1];
            if (/^[A-Za-z0-9]+$/.test(last)) return last;
        }
    } catch (e) {}
    return value;
}

function colorToRGBA(color, opacity = 1) {
    if (!color) return "rgba(255,255,255,1)";
    const alpha = typeof color.a === "number" ? color.a / 255 : 1;
    const finalAlpha = Math.max(0, Math.min(1, alpha * opacity));
    return `rgba(${color.r || 0},${color.g || 0},${color.b || 0},${finalAlpha})`;
}

function convertPaintLayer(layer) {
    if (!layer || !layer.ty) return null;
    const type = layer.ty;
    const opacity = typeof layer.opacity === "number" ? layer.opacity : 1;

    if (type.__typename === "PaintLayerTypeSingleColor") {
        const color = colorToRGBA(type.color, opacity);
        return { image: `linear-gradient(${color},${color})`, size: "100% 100%", repeat: "no-repeat" };
    }
    if (type.__typename === "PaintLayerTypeLinearGradient") {
        const stops = (type.stops || []).map(stop => `${colorToRGBA(stop.color, opacity)} ${stop.at * 100}%`).join(",");
        const fn = type.repeating ? "repeating-linear-gradient" : "linear-gradient";
        return { image: `${fn}(${type.angle || 0}deg,${stops})`, size: "100% 100%", repeat: "no-repeat" };
    }
    if (type.__typename === "PaintLayerTypeRadialGradient") {
        const stops = (type.stops || []).map(stop => `${colorToRGBA(stop.color, opacity)} ${stop.at * 100}%`).join(",");
        const fn = type.repeating ? "repeating-radial-gradient" : "radial-gradient";
        const shape = type.shape === "ELLIPSE" ? "ellipse" : "circle";
        return { image: `${fn}(${shape},${stops})`, size: "100% 100%", repeat: "no-repeat" };
    }
    if (type.__typename === "PaintLayerTypeImage") {
        const images = type.images || [];
        const image = images.slice().sort((a, b) => (b.frameCount || 1) - (a.frameCount || 1))[0] || null;
        if (!image) return null;
        return { image: `url("${image.url}")`, size: "cover", repeat: "no-repeat" };
    }
    return null;
}

async function loadPaint() {
    const paintId = extractPaintId(paintParam);
    if (!paintId) return;

    try {
        const response = await fetch(SEVENTV_API, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ query: PAINT_QUERY })
        });
        const result = await response.json();
        const paints = result?.data?.paints?.paints || [];
        const wanted = String(paintId).toLowerCase();
        const paint = paints.find(item => String(item.id).toLowerCase() === wanted);

        if (paint && paint.data) {
            const layers = paint.data.layers || [];
            const rendered = layers.map(convertPaintLayer).filter(Boolean);
            if (rendered.length) {
                timerEl.style.backgroundImage = rendered.map(l => l.image).join(",");
                timerEl.style.backgroundSize = rendered.map(l => l.size).join(",");
                timerEl.style.backgroundRepeat = rendered.map(l => l.repeat).join(",");
                timerEl.style.backgroundPosition = rendered.map(() => "center").join(",");
                timerEl.style.color = "transparent";
                timerEl.style.webkitTextFillColor = "transparent";
            }
            const shadows = paint.data.shadows || [];
            if (shadows.length) {
                timerEl.style.filter = shadows.map(s => `drop-shadow(${s.offsetX || 0}px ${s.offsetY || 0}px ${s.blur || 0}px ${colorToRGBA(s.color)})`).join(" ");
            }
        }
    } catch(e) {}
}


function getAudioContext() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    return audioCtx;
}

function unlockAudio() {
    const ctx = getAudioContext();
    if (ctx.state === 'suspended') {
        ctx.resume();
    }
}

window.addEventListener('click', unlockAudio, { once: true });
window.addEventListener('keydown', unlockAudio, { once: true });

function extractYouTubeId(url) {
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/;
    const match = url.match(regExp);
    return (match && match[2].length === 11) ? match[2] : null;
}

function onYouTubeIframeAPIReady() {
    ytPlayer = new YT.Player('ytPlayer', {
        height: '1',
        width: '1',
        playerVars: { 'autoplay': 0, 'controls': 0 },
        events: {
            'onReady': () => { isYtReady = true; }
        }
    });
}

function triggerFinishSound() {
    if (soundPlayed) return;
    soundPlayed = true;

    if (soundParam === 'none') return;

    if (soundParam === 'custom' && customSoundParam) {
        const ytId = extractYouTubeId(customSoundParam);
        if (ytId) {
            if (isYtReady && ytPlayer) {
                ytPlayer.loadVideoById(ytId);
                ytPlayer.setVolume(volumeParam * 100);
                ytPlayer.playVideo();
            }
        } else {
            const audio = new Audio(customSoundParam);
            audio.crossOrigin = "anonymous";
            audio.volume = volumeParam;
            audio.play().catch(e => console.log("Audio autoplay restricted:", e));
        }
        return;
    }

  
    const ctx = getAudioContext();
    const now = ctx.currentTime;
    const gainNode = ctx.createGain();
    gainNode.gain.setValueAtTime(volumeParam, now);
    gainNode.connect(ctx.destination);

    if (soundParam === 'chime') {
        [523.25, 659.25, 783.99].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + i * 0.08);
            g.gain.setValueAtTime(0.3, now + i * 0.08);
            g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.08 + 0.6);
            osc.connect(g);
            g.connect(gainNode);
            osc.start(now + i * 0.08);
            osc.stop(now + i * 0.08 + 0.6);
        });
    } else if (soundParam === 'bell') {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        g.gain.setValueAtTime(0.5, now);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);
        osc.connect(g);
        g.connect(gainNode);
        osc.start(now);
        osc.stop(now + 1.2);
    } else if (soundParam === 'buzzer') {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        g.gain.setValueAtTime(0.4, now);
        g.gain.linearRampToValueAtTime(0.0001, now + 0.4);
        osc.connect(g);
        g.connect(gainNode);
        osc.start(now);
        osc.stop(now + 0.4);
    } else if (soundParam === 'alarm') {
        [0, 0.15, 0.3].forEach(offset => {
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(950, now + offset);
            g.gain.setValueAtTime(0.3, now + offset);
            g.gain.setValueAtTime(0.0001, now + offset + 0.08);
            osc.connect(g);
            g.connect(gainNode);
            osc.start(now + offset);
            osc.stop(now + offset + 0.08);
        });
    }
}


function parseTime(value) {
    const parts = value.split(":").map(Number);
    if (parts.length === 2) return (parts[0] * 60) + parts[1];
    if (parts.length === 3) return (parts[0] * 3600) + (parts[1] * 60) + parts[2];
    return 0;
}

function formatTime(seconds) {
    seconds = Math.max(0, Math.floor(seconds));
    const hours = Math.floor(seconds / 3600);
    const minutes = Math.floor((seconds % 3600) / 60);
    const secs = seconds % 60;

    if (hours > 0) {
        return `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
    }
    return `${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
}

let remaining = parseTime(startParam);
let lastTime = performance.now();

function runTimer() {
    const now = performance.now();
    const delta = (now - lastTime) / 1000;
    lastTime = now;

    if (remaining > 0) {
        remaining -= delta;
        if (remaining <= 0) {
            remaining = 0;
            triggerFinishSound();
        }
    }

    timerEl.textContent = formatTime(remaining);
    requestAnimationFrame(runTimer);
}


setupStyles();
loadPaint();
runTimer();
</script>

</body>
</html>
