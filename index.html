<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7TV Timer Generator</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #0d0d12;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 25px;
    }

    .box {
        width: 100%;
        max-width: 650px;
        background: #181820;
        padding: 30px;
        border-radius: 18px;
        border: 1px solid #30303a;
    }

    h1 {
        margin-top: 0;
    }

    label {
        display: block;
        margin-top: 18px;
        margin-bottom: 7px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 13px;
        background: #0d0d12;
        color: white;
        border: 1px solid #383842;
        border-radius: 8px;
        font-size: 15px;
    }

    button {
        width: 100%;
        padding: 14px;
        margin-top: 20px;
        border: 0;
        border-radius: 8px;
        background: #7657ff;
        color: white;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        opacity: .9;
    }

    .preview {
        margin-top: 25px;
        min-height: 180px;
        display: flex;
        justify-content: center;
        align-items: center;
        background: repeating-conic-gradient(#222 0% 25%, #181818 0% 50%) 50% / 20px 20px;
        border-radius: 12px;
    }

    #previewTimer {
        font-size: 100px;
        font-weight: bold;
    }

    .result {
        display: none;
        margin-top: 20px;
    }
</style>
</head>

<body>

<div class="box">

    <h1>🎨 7TV Timer Generator</h1>

    <p>Put a 7TV Paint URL inside your timer text.</p>

    <label>7TV Paint URL</label>

    <input
        id="paintUrl"
        placeholder="https://cdn.7tv.app/paint/..."
    >

    <label>Starting Minutes</label>

    <input
        id="minutes"
        type="number"
        value="0"
        min="0"
    >

    <label>Starting Seconds</label>

    <input
        id="seconds"
        type="number"
        value="0"
        min="0"
        max="59"
    >

    <label>Timer Size</label>

    <input
        id="size"
        type="number"
        value="100"
        min="20"
        max="500"
    >

    <button onclick="generate()">
        🔗 Generate OBS Timer
    </button>

    <div class="preview">
        <div id="previewTimer">00:00</div>
    </div>

    <div class="result" id="result">

        <label>OBS Browser Source URL</label>

        <input id="output" readonly>

        <button onclick="copyURL()">
            📋 Copy OBS URL
        </button>

    </div>

</div>


<script>

function generate() {

    const paint =
        document.getElementById("paintUrl").value.trim();

    const minutes =
        Number(document.getElementById("minutes").value) || 0;

    const seconds =
        Number(document.getElementById("seconds").value) || 0;

    const size =
        Number(document.getElementById("size").value) || 100;


    if (!paint) {
        alert("Paste your 7TV Paint URL first!");
        return;
    }


    const start =
        (minutes * 60) + seconds;


    const params = new URLSearchParams();

    params.set("paint", paint);
    params.set("start", start);
    params.set("size", size);


    const url =
        new URL("overlay.html", window.location.href);

    url.search = params.toString();


    document.getElementById("output").value =
        url.href;

    document.getElementById("result").style.display =
        "block";


    updatePreview(paint, size);
}


function updatePreview(paint, size) {

    const timer =
        document.getElementById("previewTimer");


    /*
       The Paint becomes the TEXT itself.
       It is NOT displayed as a background box.
    */

    timer.style.fontSize = size + "px";

    timer.style.backgroundImage =
        `url("${paint}")`;

    timer.style.backgroundSize =
        "cover";

    timer.style.backgroundPosition =
        "center";

    timer.style.backgroundRepeat =
        "no-repeat";

    timer.style.webkitBackgroundClip =
        "text";

    timer.style.backgroundClip =
        "text";

    timer.style.color =
        "transparent";

    timer.style.webkitTextFillColor =
        "transparent";
}


function copyURL() {

    const output =
        document.getElementById("output");

    navigator.clipboard.writeText(output.value);

    alert("Copied! 🔥");
}

</script>

</body>
</html>
