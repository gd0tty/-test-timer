<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            font-family: Arial, sans-serif;
            color: white;
        }

        .box {
            width: 450px;
            padding: 30px;
            border-radius: 18px;
            background: #1c1c1c;
            box-shadow: 0 10px 40px rgba(0,0,0,.4);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2b2b2b;
            color: white;
            outline: none;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #9147ff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #772ce8;
        }

        #result {
            display: none;
            margin-top: 20px;
        }

        #generatedLink {
            margin-top: 8px;
            word-break: break-all;
            padding: 12px;
            border-radius: 8px;
            background: #111;
            font-size: 13px;
        }

        .copy {
            background: #333;
            margin-top: 10px;
        }

        .copy:hover {
            background: #444;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Timer Generator</h1>

    <label>7TV Paint URL</label>
    <input
        id="paintUrl"
        type="text"
        placeholder="Paste your 7TV Paint URL here"
    >

    <label>Starting Time</label>
    <input
        id="startTime"
        type="text"
        value="00:00"
        placeholder="00:00"
    >

    <label>Timer Size</label>
    <input
        id="fontSize"
        type="number"
        value="120"
        min="20"
        max="1000"
    >

    <button onclick="generate()">Generate Timer</button>

    <div id="result">

        <strong>Your OBS Browser Source URL:</strong>

        <div id="generatedLink"></div>

        <button class="copy" onclick="copyLink()">
            Copy OBS URL
        </button>

    </div>

</div>

<script>

function generate() {

    const paintUrl = document.getElementById("paintUrl").value.trim();
    const startTime = document.getElementById("startTime").value.trim();
    const fontSize = document.getElementById("fontSize").value;

    if (!paintUrl) {
        alert("Paste a 7TV Paint URL first.");
        return;
    }

    const baseUrl = new URL("overlay.html", window.location.href);

    baseUrl.searchParams.set("paint", paintUrl);
    baseUrl.searchParams.set("start", startTime || "00:00");
    baseUrl.searchParams.set("size", fontSize);

    const finalUrl = baseUrl.toString();

    document.getElementById("generatedLink").textContent = finalUrl;
    document.getElementById("result").style.display = "block";
}

function copyLink() {

    const link = document.getElementById("generatedLink").textContent;

    navigator.clipboard.writeText(link);

    alert("OBS URL copied!");
}

</script>

</body>
</html>
