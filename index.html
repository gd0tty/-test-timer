<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Timer</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }

        #timer {
            font-family: Arial, sans-serif;
            font-size: 100px;
            font-weight: bold;
            color: white;
            text-align: center;
        }
    </style>
</head>

<body>

    <div id="timer">00:00</div>

    <script>
        let timeLeft = 0;

    const timer = document.getElementById("timer");

    function updateTimer() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;

        timer.textContent =
            String(minutes).padStart(2, "0") + ":" +
            String(seconds).padStart(2, "0");
    }

    function countup() {
        timeLeft++;
        updateTimer();
    }

    updateTimer();
    setInterval(countup, 1000);
    </script>

</body>
</html>
