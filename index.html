<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gd0tty's Timer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family: "Inter", sans-serif;
    background:
        radial-gradient(circle at 20% 20%, rgba(0, 200, 255, 0.13), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(100, 70, 255, 0.15), transparent 30%),
        #070b14;
    color: white;
    overflow-x: hidden;
}


.background-glow {
    position: fixed;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    filter: blur(120px);
    opacity: .18;
    pointer-events: none;
}

.glow-one {
    background: #00c8ff;
    top: -200px;
    left: -200px;
}

.glow-two {
    background: #7c4dff;
    bottom: -250px;
    right: -200px;
}


.container {
    width: min(1100px, calc(100% - 40px));
    margin: 0 auto;
    padding: 45px 0 60px;
}


.title {
    text-align: center;
    margin-bottom: 35px;
}

.logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-size: 30px;
    font-weight: 900;
    margin-bottom: 10px;
}

.logo-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #00c8ff, #675cff);
    box-shadow: 0 0 30px rgba(0, 200, 255, .25);
}

.title p {
    margin: 0;
    color: #8d98ad;
    font-size: 14px;
}


.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
    align-items: stretch;
}


.card {
    background: rgba(15, 21, 35, .88);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 22px;
    padding: 26px;
    box-shadow: 0 20px 70px rgba(0,0,0,.25);
    backdrop-filter: blur(15px);
}

.card h2 {
    margin: 0 0 6px;
    font-size: 20px;
}

.card-description {
    color: #7f8aa0;
    font-size: 13px;
    margin-bottom: 24px;
}

/* INPUTS */

label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 8px;
    color: #dce3f0;
}

.input-group {
    margin-bottom: 18px;
}

input {
    width: 100%;
    padding: 14px 15px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.08);
    background: #0a0f1c;
    color: white;
    outline: none;
    font-family: inherit;
    font-size: 14px;
    transition: .2s;
}

input:focus {
    border-color: #00c8ff;
    box-shadow: 0 0 0 3px rgba(0,200,255,.08);
}

input::placeholder {
    color: #596579;
}


.generate {
    width: 100%;
    border: 0;
    padding: 15px;
    border-radius: 13px;
    color: white;
    font-family: inherit;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
    background: linear-gradient(135deg, #00bfff, #675cff);
    box-shadow: 0 10px 30px rgba(0,170,255,.18);
    transition: .2s;
}

.generate:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 35px rgba(0,170,255,.3);
}

.generate:active {
    transform: translateY(0);
}


.paint-preview {
    width: 100%;
    min-height: 190px;
    border-radius: 16px;
    border: 1px dashed rgba(255,255,255,.12);
    background:
        linear-gradient(45deg, #101624 25%, transparent 25%),
        linear-gradient(-45deg, #101624 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #101624 75%),
        linear-gradient(-45deg, transparent 75%, #101624 75%);
    background-size: 28px 28px;
    background-position: 0 0, 0 14px, 14px -14px, -14px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    margin-bottom: 18px;
}

.paint-preview img {
    max-width: 90%;
    max-height: 180px;
    object-fit: contain;
    display: none;
    filter: drop-shadow(0 10px 25px rgba(0,0,0,.35));
}

.preview-placeholder {
    color: #657087;
    font-size: 13px;
    text-align: center;
    padding: 20px;
}

.preview-placeholder span {
    display: block;
    font-size: 30px;
    margin-bottom: 8px;
}


.timer-preview {
    min-height: 190px;
    border-radius: 16px;
    background: #050811;
    border: 1px solid rgba(255,255,255,.06);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
}

.timer {
    font-size: 90px;
    font-weight: 900;
    line-height: 1;
    color: white;
    text-align: center;
    white-space: nowrap;
}


.result {
    margin-top: 22px;
    display: none;
}

.result-box {
    display: flex;
    gap: 10px;
}

.result-box input {
    flex: 1;
}

.copy {
    border: 0;
    border-radius: 12px;
    padding: 0 20px;
    background: #151e30;
    color: white;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,.08);
}

.copy:hover {
    background: #1c2940;
}

.success {
    margin-top: 12px;
    font-size: 12px;
    color: #62e6a5;
    display: none;
}


@media (max-width: 800px) {

    .container {
        width: min(94%, 600px);
        padding-top: 25px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .timer {
        font-size: 65px;
    }

}

</style>
</head>

<body>

<div class="background-glow glow-one"></div>
<div class="background-glow glow-two"></div>

<div class="container">

    <div class="title">

        <div class="logo">
            <div class="logo-icon">⏱</div>
            TimerForge
        </div>

        <p>Create a custom OBS timer with your 7TV Paint</p>

    </div>


    <div class="grid">

        

        <div class="card">

            <h2>Timer Settings</h2>

            <div class="card-description">
                Configure your timer and 7TV Paint.
            </div>


            <div class="input-group">

                <label>7TV Paint URL</label>

                <input
                    id="paintUrl"
                    type="text"
                    placeholder="Paste your 7TV Paint URL..."
                    oninput="updatePaintPreview()"
                >

            </div>


            <div class="input-group">

                <label>Google Font</label>

                <input
                    id="fontName"
                    type="text"
                    value="Roboto"
                    placeholder="Example: Poppins"
                    oninput="updateFont()"
                >

            </div>


            <div class="input-group">

                <label>Starting Time</label>

                <input
                    id="startTime"
                    type="text"
                    value="00:00"
                    placeholder="00:00"
                    oninput="updateTimerPreview()"
                >

            </div>


            <div class="input-group">

                <label>Font Size</label>

                <input
                    id="fontSize"
                    type="number"
                    value="120"
                    min="20"
                    max="500"
                    oninput="updateTimerPreview()"
                >

            </div>


            <button class="generate" onclick="generateTimer()">
                Generate OBS Timer
            </button>


            <div class="result" id="result">

                <div class="result-box">

                    <input
                        id="obsUrl"
                        type="text"
                        readonly
                    >

                    <button class="copy" onclick="copyUrl()">
                        Copy
                    </button>

                </div>

                <div class="success" id="success">
                    ✓ OBS URL copied!
                </div>

            </div>

        </div>


        

        <div class="card">

            <h2>Live Preview</h2>

            <div class="card-description">
                See your Paint before generating the OBS URL.
            </div>


            <div class="paint-preview">

                <div class="preview-placeholder" id="placeholder">

                    <span>🎨</span>

                    Paste a 7TV Paint URL<br>
                    to preview it here

                </div>

                <img id="paintImage" alt="7TV Paint Preview">

            </div>


            <div class="timer-preview">

                <div
                    class="timer"
                    id="timer"
                >
                    00:00
                </div>

            </div>

        </div>

    </div>

</div>


<script>



function updatePaintPreview() {

    const url = document.getElementById("paintUrl").value.trim();

    const image = document.getElementById("paintImage");

    const placeholder = document.getElementById("placeholder");


    if (!url) {

        image.style.display = "none";

        placeholder.style.display = "block";

        return;

    }


    image.onload = function() {

        image.style.display = "block";

        placeholder.style.display = "none";

    };


    image.onerror = function() {

        image.style.display = "none";

        placeholder.style.display = "block";

        placeholder.innerHTML =
            "<span>⚠️</span>Invalid or unavailable Paint URL";

    };


    image.src = url;

}




function updateFont() {

    const font =
        document.getElementById("fontName").value.trim();

    if (!font) return;


    const encoded =
        font.replace(/\s+/g, "+");


    const old =
        document.getElementById("dynamicFont");

    if (old) old.remove();


    const link =
        document.createElement("link");

    link.id = "dynamicFont";

    link.rel = "stylesheet";

    link.href =
        "https://fonts.googleapis.com/css2?family=" +
        encoded +
        ":wght@100;200;300;400;500;600;700;800;900&display=swap";


    document.head.appendChild(link);


    document.getElementById("timer").style.fontFamily =
        `"${font}", sans-serif`;
}




function parseTime(value) {

    const parts =
        value.split(":").map(Number);


    if (parts.length === 2) {

        return (
            parts[0] * 60 +
            parts[1]
        );

    }


    if (parts.length === 3) {

        return (
            parts[0] * 3600 +
            parts[1] * 60 +
            parts[2]
        );

    }


    return 0;

}


function formatTime(seconds) {

    seconds =
        Math.floor(seconds);


    const hours =
        Math.floor(seconds / 3600);


    const minutes =
        Math.floor((seconds % 3600) / 60);


    const secs =
        seconds % 60;


    if (hours > 0) {

        return (
            String(hours).padStart(2, "0") +
            ":" +
            String(minutes).padStart(2, "0") +
            ":" +
            String(secs).padStart(2, "0")
        );

    }


    return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(secs).padStart(2, "0")
    );

}


let previewElapsed =
    parseTime(
        document.getElementById("startTime").value
    );


let previewLast =
    performance.now();


function updateTimerPreview() {

    previewElapsed =
        parseTime(
            document.getElementById("startTime").value
        );

    previewLast =
        performance.now();

}


function runPreview() {

    const now =
        performance.now();


    previewElapsed +=
        (now - previewLast) / 1000;


    previewLast = now;


    const timer =
        document.getElementById("timer");


    timer.textContent =
        formatTime(previewElapsed);


    const size =
        document.getElementById("fontSize").value;


    timer.style.fontSize =
        size + "px";


    requestAnimationFrame(runPreview);

}


runPreview();




function generateTimer() {

    const paint =
        document.getElementById("paintUrl").value.trim();


    if (!paint) {

        alert("Paste your 7TV Paint URL first!");

        return;

    }


    const font =
        document.getElementById("fontName").value.trim();


    const start =
        document.getElementById("startTime").value.trim();


    const size =
        document.getElementById("fontSize").value;


    const overlay =
        new URL(
            "overlay.html",
            window.location.href
        );


    overlay.searchParams.set(
        "paint",
        paint
    );


    overlay.searchParams.set(
        "start",
        start
    );


    overlay.searchParams.set(
        "size",
        size
    );


    overlay.searchParams.set(
        "font",
        font
    );


    

    overlay.searchParams.set(
        "v",
        Date.now()
    );


    document.getElementById("obsUrl").value =
        overlay.href;


    document.getElementById("result").style.display =
        "block";

}




function copyUrl() {

    const input =
        document.getElementById("obsUrl");


    navigator.clipboard.writeText(
        input.value
    );


    const success =
        document.getElementById("success");


    success.style.display =
        "block";


    setTimeout(function() {

        success.style.display =
            "none";

    }, 2000);

}

</script>

</body>
</html>
