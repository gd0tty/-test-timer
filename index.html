<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GD0TTY'S TIMER</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at 20% 20%, rgba(0, 200, 255, .12), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(110, 70, 255, .14), transparent 35%),
        #070b14;
    color: white;
}

.container {
    width: min(1050px, calc(100% - 40px));
    margin: 0 auto;
    padding: 35px 0 60px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
    align-items: stretch;
}

.card {
    background: rgba(15, 21, 35, .9);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 22px;
    padding: 26px;
    box-shadow: 0 20px 70px rgba(0,0,0,.3);
}

.card h2 {
    margin: 0 0 7px;
    font-size: 20px;
}

.description {
    color: #7f8aa0;
    font-size: 13px;
    margin-bottom: 24px;
}

.input-group {
    margin-bottom: 18px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 14px 15px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.08);
    background: #0a0f1c;
    color: white;
    outline: none;
    font-family: inherit;
    font-size: 14px;
}

input:focus {
    border-color: #00c8ff;
    box-shadow: 0 0 0 3px rgba(0,200,255,.08);
}

input::placeholder {
    color: #596579;
}

.generate {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 13px;
    color: white;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    background: linear-gradient(135deg, #00bfff, #675cff);
    transition: .2s;
}

.generate:hover {
    transform: translateY(-2px);
}

.timer-preview {
    height: 300px;
    border-radius: 18px;
    background: #050811;
    border: 1px solid rgba(255,255,255,.06);

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

.timer {
    font-size: 90px;
    font-weight: 900;
    line-height: 1;
    white-space: nowrap;

    background-image: none;
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;

    -webkit-background-clip: text;
    background-clip: text;

    color: white;
}

.result {
    display: none;
    margin-top: 18px;
}

.result-box {
    display: flex;
    gap: 10px;
}

.result-box input {
    flex: 1;
    min-width: 0;
}

.copy {
    border: 0;
    border-radius: 12px;
    padding: 0 20px;
    background: #151e30;
    color: white;
    font-weight: 700;
    cursor: pointer;
}

.copy:hover {
    background: #1d2940;
}

.success {
    display: none;
    margin-top: 10px;
    color: #62e6a5;
    font-size: 12px;
}

@media (max-width: 800px) {

    .container {
        width: calc(100% - 25px);
        padding-top: 20px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .timer {
        font-size: 60px;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="grid">

       

        <div class="card">

            <h2>Timer Settings</h2>

            <div class="description">
                Configure your countdown timer and 7TV Paint.
            </div>

            <div class="input-group">

                <label>7TV Paint URL</label>

                <input
                    id="paintUrl"
                    type="text"
                    placeholder="Paste your 7TV Paint URL..."
                    oninput="updatePreview()"
                >

            </div>

            <div class="input-group">

                <label>Google Font</label>

                <input
                    id="fontName"
                    type="text"
                    value="Roboto"
                    placeholder="Example: Poppins"
                    oninput="updateFont()"
                >

            </div>

            <div class="input-group">

                <label>Countdown Time</label>

                <input
                    id="startTime"
                    type="text"
                    value="10:00"
                    placeholder="10:00"
                    oninput="resetPreviewTime()"
                >

            </div>

            <div class="input-group">

                <label>Font Size</label>

                <input
                    id="fontSize"
                    type="number"
                    value="120"
                    min="20"
                    max="500"
                    oninput="updateSize()"
                >

            </div>

            <button
                class="generate"
                onclick="generateTimer()"
            >
                Generate OBS Timer
            </button>

            <div
                class="result"
                id="result"
            >

                <div class="result-box">

                    <input
                        id="obsUrl"
                        type="text"
                        readonly
                    >

                    <button
                        class="copy"
                        onclick="copyUrl()"
                    >
                        Copy
                    </button>

                </div>

                <div
                    class="success"
                    id="success"
                >
                    ✓ OBS URL copied!
                </div>

            </div>

        </div>


        

        <div class="card">

            <h2>Live Preview</h2>

            <div class="description">
                Your Paint is applied directly to the countdown.
            </div>

            <div class="timer-preview">

                <div
                    class="timer"
                    id="timer"
                >
                    10:00
                </div>

            </div>

        </div>

    </div>

</div>


<script>



const timer =
    document.getElementById("timer");

const paintInput =
    document.getElementById("paintUrl");

const fontInput =
    document.getElementById("fontName");

const startInput =
    document.getElementById("startTime");

const sizeInput =
    document.getElementById("fontSize");




function updatePreview() {

    const url =
        paintInput.value.trim();

    if (!url) {

        timer.style.backgroundImage = "none";

        timer.style.color = "white";

        timer.style.webkitTextFillColor = "white";

        return;
    }

    timer.style.backgroundImage =
        `url("${url}")`;

    timer.style.color =
        "transparent";

    timer.style.webkitTextFillColor =
        "transparent";
}




function updateFont() {

    const font =
        fontInput.value.trim();

    if (!font) return;

    const old =
        document.getElementById("googleFont");

    if (old) {
        old.remove();
    }

    const link =
        document.createElement("link");

    link.id =
        "googleFont";

    link.rel =
        "stylesheet";

    link.href =
        "https://fonts.googleapis.com/css2?family=" +
        font.replace(/\s+/g, "+") +
        ":wght@100;200;300;400;500;600;700;800;900&display=swap";

    document.head.appendChild(link);

    timer.style.fontFamily =
        `"${font}", sans-serif`;
}




function updateSize() {

    const size =
        sizeInput.value || 120;

    timer.style.fontSize =
        size + "px";
}




function parseTime(value) {

    const parts =
        value.split(":").map(Number);

    if (parts.length === 2) {

        return (
            (parts[0] * 60) +
            parts[1]
        );

    }

    if (parts.length === 3) {

        return (
            (parts[0] * 3600) +
            (parts[1] * 60) +
            parts[2]
        );

    }

    return 0;
}


function formatTime(seconds) {

    seconds =
        Math.max(0, Math.floor(seconds));

    const hours =
        Math.floor(seconds / 3600);

    const minutes =
        Math.floor((seconds % 3600) / 60);

    const secs =
        seconds % 60;


    if (hours > 0) {

        return (
            String(hours).padStart(2, "0") +
            ":" +
            String(minutes).padStart(2, "0") +
            ":" +
            String(secs).padStart(2, "0")
        );

    }

    return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(secs).padStart(2, "0")
    );
}




let remaining =
    parseTime(startInput.value);

let lastTime =
    performance.now();


function resetPreviewTime() {

    remaining =
        parseTime(startInput.value);

    lastTime =
        performance.now();

    timer.textContent =
        formatTime(remaining);
}


function runTimer() {

    const now =
        performance.now();

    const delta =
        (now - lastTime) / 1000;

    lastTime =
        now;


    if (remaining > 0) {

        remaining -= delta;

        if (remaining < 0) {
            remaining = 0;
        }

    }


    timer.textContent =
        formatTime(remaining);


    requestAnimationFrame(runTimer);
}


runTimer();




function generateTimer() {

    const paint =
        paintInput.value.trim();

    if (!paint) {

        alert(
            "Paste your 7TV Paint URL first!"
        );

        return;
    }


    const font =
        fontInput.value.trim();

    const start =
        startInput.value.trim();

    const size =
        sizeInput.value;


    const overlay =
        new URL(
            "overlay.html",
            window.location.href
        );


    overlay.searchParams.set(
        "paint",
        paint
    );


    overlay.searchParams.set(
        "start",
        start
    );


    overlay.searchParams.set(
        "size",
        size
    );


    overlay.searchParams.set(
        "font",
        font
    );


  

    overlay.searchParams.set(
        "v",
        Date.now()
    );


    document.getElementById(
        "obsUrl"
    ).value =
        overlay.href;


    document.getElementById(
        "result"
    ).style.display =
        "block";
}




function copyUrl() {

    const input =
        document.getElementById("obsUrl");


    navigator.clipboard.writeText(
        input.value
    );


    const success =
        document.getElementById("success");


    success.style.display =
        "block";


    setTimeout(() => {

        success.style.display =
            "none";

    }, 2000);
}




updateFont();
updateSize();

</script>

</body>
</html>
