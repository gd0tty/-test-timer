<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Timer</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }

        #timer {
            font-family: Arial, sans-serif;
            font-size: 100px;
            font-weight: bold;
            color: white;
            text-align: center;
        }
    </style>
</head>

<body>

    <div id="timer">10:00</div>

    <script>
        let timeLeft = 10 * 60;
        let running = true;

        const timer = document.getElementById("timer");

        function updateTimer() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;

            timer.textContent =
                String(minutes).padStart(2, "0") + ":" +
                String(seconds).padStart(2, "0");
        }

        setInterval(() => {
            if (running && timeLeft > 0) {
                timeLeft--;
                updateTimer();
            }
        }, 1000);

        updateTimer();
    </script>

</body>
</html>
