<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GD0TTY'S TIMER</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at 20% 20%, rgba(0, 200, 255, .12), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(110, 70, 255, .14), transparent 35%),
        #070b14;
    color: white;
}

.container {
    width: min(1050px, calc(100% - 40px));
    margin: 0 auto;
    padding: 35px 0 60px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
    align-items: stretch;
}

.card {
    background: rgba(15, 21, 35, .9);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 22px;
    padding: 26px;
    box-shadow: 0 20px 70px rgba(0,0,0,.3);
}

.card h2 {
    margin: 0 0 7px;
    font-size: 20px;
}

.description {
    color: #7f8aa0;
    font-size: 13px;
    margin-bottom: 24px;
}

.input-group {
    margin-bottom: 18px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 14px 15px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.08);
    background: #0a0f1c;
    color: white;
    outline: none;
    font-family: inherit;
    font-size: 14px;
}

input:focus {
    border-color: #00c8ff;
    box-shadow: 0 0 0 3px rgba(0,200,255,.08);
}

input::placeholder {
    color: #596579;
}

.generate {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 13px;
    color: white;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    background: linear-gradient(135deg, #00bfff, #675cff);
    transition: .2s;
}

.generate:hover {
    transform: translateY(-2px);
}

.timer-preview {
    height: 300px;
    border-radius: 18px;
    background: #050811;
    border: 1px solid rgba(255,255,255,.06);

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

.timer {
    font-size: 90px;
    font-weight: 900;
    line-height: 1;
    white-space: nowrap;

    background-image: none;
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;

    -webkit-background-clip: text;
    background-clip: text;

    color: white;
}

.result {
    display: none;
    margin-top: 18px;
}

.result-box {
    display: flex;
    gap: 10px;
}

.result-box input {
    flex: 1;
    min-width: 0;
}

.copy {
    border: 0;
    border-radius: 12px;
    padding: 0 20px;
    background: #151e30;
    color: white;
    font-weight: 700;
    cursor: pointer;
}

.copy:hover {
    background: #1d2940;
}

.success {
    display: none;
    margin-top: 10px;
    color: #62e6a5;
    font-size: 12px;
}


/* 7TV Paint ID Help */

.paint-help {
    margin-top: 22px;
    background: rgba(15, 21, 35, .9);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 18px;
    overflow: hidden;
}

.paint-help summary {
    padding: 18px 20px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 800;
    color: white;
    list-style: none;
}

.paint-help summary::-webkit-details-marker {
    display: none;
}

.paint-help summary::after {
    content: "▼";
    float: right;
    color: #00c8ff;
    font-size: 13px;
    transition: .2s;
}

.paint-help[open] summary::after {
    transform: rotate(180deg);
}

.paint-help summary:hover {
    color: #00c8ff;
}

.paint-help-content {
    padding: 0 20px 20px;
    display: flex;
    align-items: center;
    gap: 20px;
}

.paint-help-content p {
    margin: 0;
    color: #9aa5b8;
    font-size: 15px;
    line-height: 1.5;
    flex: 1;
}

.paint-help-gif {
    display: block;
    width: 100%;
    max-width: 280px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.08);
    flex-shrink: 0;
}


/* 7Database preview */

.database-preview {
    margin-top: 32px;
    padding: 28px;
    border-radius: 22px;
    background: rgba(15, 21, 35, .9);
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 20px 70px rgba(0,0,0,.3);
    text-align: center;
}

.database-preview h2 {
    margin: 0 0 10px;
    font-size: 26px;
    color: white;
}

.database-preview p {
    margin: 0 0 22px;
    color: #9aa5b8;
    font-size: 16px;
    line-height: 1.5;
}

.database-preview a {
    display: block;
    text-decoration: none;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(0,200,255,.25);
    background: #080d18;
    transition: .2s;
}

.database-preview a:hover {
    transform: translateY(-3px);
    border-color: #00c8ff;
    box-shadow: 0 10px 35px rgba(0,200,255,.15);
}

.database-preview img {
    display: block;
    width: 100%;
    height: 260px;
    object-fit: cover;
}

.database-preview .website-name {
    padding: 16px;
    color: #00c8ff;
    font-size: 22px;
    font-weight: 800;
}


@media (max-width: 800px) {

    .container {
        width: calc(100% - 25px);
        padding-top: 20px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .timer {
        font-size: 60px;
    }

    .database-preview h2 {
        font-size: 21px;
    }

    .database-preview img {
        height: 200px;
    }

    .paint-help-content {
        flex-direction: column-reverse;
        align-items: flex-start;
    }

    .paint-help-gif {
        max-width: 100%;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="grid">

        <div class="card">

            <h2>Timer Settings</h2>

            <div class="description">
                Configure your countdown timer and 7TV Paint.
            </div>

            <div class="input-group">

                <label>7TV Paint URL</label>

                <input
                    id="paintUrl"
                    type="text"
                    placeholder="Paste your 7TV Paint URL..."
                    oninput="updatePreview()"
                >

            </div>

            <div class="input-group">

                <label>Google Font</label>

                <input
                    id="fontName"
                    type="text"
                    value="Roboto"
                    placeholder="Example: Poppins"
                    oninput="updateFont()"
                >

            </div>

            <div class="input-group">

                <label>Countdown Time</label>

                <input
                    id="startTime"
                    type="text"
                    value="10:00"
                    placeholder="10:00"
                    oninput="resetPreviewTime()"
                >

            </div>

            <div class="input-group">

                <label>Font Size</label>

                <input
                    id="fontSize"
                    type="number"
                    value="120"
                    min="20"
                    max="500"
                    oninput="updateSize()"
                >

            </div>

            <button
                class="generate"
                onclick="generateTimer()"
            >
                Generate OBS Timer
