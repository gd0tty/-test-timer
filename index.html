
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GD0TTY'S TIMER</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 20% 20%,rgba(0,200,255,.15),transparent 35%),
    radial-gradient(circle at 80% 80%,rgba(120,70,255,.15),transparent 35%),
    #080b12;
  color:white;
  padding:40px 20px;
}

.container{
  width:100%;
  max-width:1050px;
  margin:auto;
}

h1{
  text-align:center;
  font-size:42px;
  margin:0 0 10px;
}

.subtitle{
  text-align:center;
  color:#9ca3af;
  margin-bottom:35px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.card{
  background:rgba(18,23,35,.9);
  border:1px solid rgba(255,255,255,.08);
  border-radius:20px;
  padding:25px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
}

.preview-card{
  grid-column:1/-1;
}

h2{
  margin-top:0;
}

label{
  display:block;
  margin:16px 0 7px;
  color:#cbd5e1;
}

input{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #303747;
  background:#0d111b;
  color:white;
  outline:none;
  font-size:15px;
}

input:focus{
  border-color:#22d3ee;
}

button{
  border:0;
  border-radius:10px;
  padding:13px 18px;
  margin-top:15px;
  color:white;
  background:linear-gradient(135deg,#06b6d4,#6366f1);
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  filter:brightness(1.1);
}

.preview-area{
  width:100%;
  height:300px;
  border-radius:15px;
  background:
    linear-gradient(45deg,#151a24 25%,transparent 25%),
    linear-gradient(-45deg,#151a24 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#151a24 75%),
    linear-gradient(-45deg,transparent 75%,#151a24 75%);
  background-size:30px 30px;
  background-position:0 0,0 15px,15px -15px,-15px 0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

#timerPreview{
  font-weight:900;
  line-height:1;
  white-space:nowrap;
  text-align:center;
  color:white;
}

.paint-status{
  text-align:center;
  color:#94a3b8;
  margin-top:12px;
}

.output{
  display:none;
  margin-top:20px;
  padding:15px;
  border-radius:12px;
  background:#0b101a;
}

@media(max-width:750px){
  .grid{
    grid-template-columns:1fr;
  }

  .preview-card{
    grid-column:auto;
  }

  h1{
    font-size:32px;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>GD0TTY'S TIMER</h1>


<div class="grid">

<div class="card">

<h2>🎨 Timer Settings</h2>

<label>7TV Paint ID</label>

<input
  id="paint"
  placeholder="01M19D4SHRVM6MWQ4PJB9TG97T"
  oninput="updatePreview()"
>

<label>Font</label>

<input
  id="font"
  value="Arial"
  oninput="updatePreview()"
>

<label>Countdown Time</label>

<input
  id="time"
  value="10:00"
  oninput="updatePreview()"
>

<label>Font Size</label>

<input
  id="size"
  type="number"
  value="150"
  oninput="updatePreview()"
>

<button onclick="generateTimer()">
Generate OBS Timer
</button>

<div class="output" id="output">

<label>OBS Browser Source URL</label>

<input id="obsUrl" readonly>

<button onclick="copyUrl()">
Copy URL
</button>

</div>

</div>


<div class="card preview-card">

<h2>👀 7TV Paint Preview</h2>

<div class="preview-area">

<div id="timerPreview">
10:00
</div>

</div>

<div id="paintStatus" class="paint-status">
Enter a 7TV Paint ID
</div>

</div>

</div>

</div>


<script>

let paintRequest = 0;




function parseTime(value){

  const parts = value.split(":").map(Number);

  if(parts.length !== 2){
    return 600000;
  }

  const minutes =
    Number.isFinite(parts[0]) ? parts[0] : 0;

  const seconds =
    Number.isFinite(parts[1]) ? parts[1] : 0;

  return Math.max(
    0,
    (minutes * 60 + seconds) * 1000
  );
}


function formatTime(ms){

  const total =
    Math.ceil(ms / 1000);

  const minutes =
    Math.floor(total / 60);

  const seconds =
    total % 60;

  return (
    String(minutes).padStart(2,"0") +
    ":" +
    String(seconds).padStart(2,"0")
  );
}




function getPaintId(value){

  value = value.trim();

  const match =
    value.match(/[0-9A-Z]{20,40}/i);

  return match ? match[0] : "";
}




function colorToCSS(color){

  if(typeof color === "string"){
    return color;
  }

  if(!color){
    return "white";
  }

  let r = color.r ?? 255;
  let g = color.g ?? 255;
  let b = color.b ?? 255;
  let a = color.a ?? 1;

  if(r <= 1 && g <= 1 && b <= 1){
    r *= 255;
    g *= 255;
    b *= 255;
  }

  if(a > 1){
    a /= 255;
  }

  return `rgba(${r},${g},${b},${a})`;
}




function gradientToCSS(gradient){

  if(!gradient){
    return null;
  }

  const stops =
    Array.isArray(gradient.stops)
      ? gradient.stops
      : [];

  if(!stops.length){
    return null;
  }

  const cssStops =
    stops.map(stop => {

      const color =
        colorToCSS(
          stop.color ?? stop
        );

      let position = "";

      if(stop.at !== undefined){
        position =
          ` ${stop.at * 100}%`;
      }

      return color + position;

    }).join(", ");

  const angle =
    gradient.angle ?? 0;

  const repeat =
    gradient.repeat === true;

  const fn =
    String(
      gradient.function || ""
    ).toUpperCase();

  if(
    fn.includes("RADIAL") ||
    fn.includes("CIRCLE")
  ){

    return (
      (repeat
        ? "repeating-radial-gradient"
        : "radial-gradient") +
      `(circle,${cssStops})`
    );
  }

  return (
    (repeat
      ? "repeating-linear-gradient"
      : "linear-gradient") +
    `(${angle}deg,${cssStops})`
  );
}




function applyPaint(paint){

  const timer =
    document.getElementById("timerPreview");

  timer.style.textShadow = "none";
  timer.style.backgroundImage = "none";
  timer.style.backgroundColor = "transparent";
  timer.style.color = "white";
  timer.style.webkitTextFillColor = "white";


  if(!paint){
    return;
  }


  

  if(
    Array.isArray(paint.gradients) &&
    paint.gradients.length
  ){

    const gradients =
      paint.gradients
        .map(gradientToCSS)
        .filter(Boolean);

    if(gradients.length){

      timer.style.backgroundImage =
        gradients.join(",");

      timer.style.backgroundClip =
        "text";

      timer.style.webkitBackgroundClip =
        "text";

      timer.style.color =
        "transparent";

      timer.style.webkitTextFillColor =
        "transparent";
    }
  }


  

  else if(paint.image_url){

    timer.style.backgroundImage =
      `url("${paint.image_url}")`;

    timer.style.backgroundSize =
      "cover";

    timer.style.backgroundPosition =
      "center";

    timer.style.backgroundRepeat =
      "no-repeat";

    timer.style.backgroundClip =
      "text";

    timer.style.webkitBackgroundClip =
      "text";

    timer.style.color =
      "transparent";

    timer.style.webkitTextFillColor =
      "transparent";
  }


 

  else if(paint.color){

    const color =
      colorToCSS(paint.color);

    timer.style.color = color;

    timer.style.webkitTextFillColor =
      color;
  }


 

  if(Array.isArray(paint.shadows)){

    const shadows =
      paint.shadows.map(shadow => {

        const color =
          colorToCSS(shadow.color);

        return `${shadow.x ?? 0}px ${shadow.y ?? 0}px ${shadow.blur ?? 0}px ${color}`;

      });

    if(shadows.length){

      timer.style.textShadow =
        shadows.join(",");
    }
  }
}




async function loadPaint(){

  const id =
    getPaintId(
      document.getElementById("paint").value
    );

  const status =
    document.getElementById("paintStatus");

  const request =
    ++paintRequest;


  if(!id){

    status.textContent =
      "Enter a 7TV Paint ID";

    applyPaint(null);

    return;
  }


  status.textContent =
    "Loading 7TV Paint...";


  try{

    const response =
      await fetch(
        "https://7tv.io/v3/cosmetics"
      );


    if(!response.ok){
      throw new Error("7TV request failed");
    }


    const data =
      await response.json();


    if(request !== paintRequest){
      return;
    }


    let paints = [];


    if(Array.isArray(data)){
      paints = data;
    }

    else if(Array.isArray(data.paints)){
      paints = data.paints;
    }

    else if(Array.isArray(data.items)){
      paints = data.items;
    }


    const paint =
      paints.find(
        item =>
          String(item.id).toUpperCase() ===
          id.toUpperCase()
      );


    if(!paint){

      status.textContent =
        "❌ Paint ID not found";

      applyPaint(null);

      return;
    }


    applyPaint(paint);

    status.textContent =
      "✅ 7TV Paint loaded";


  }catch(error){

    console.error(error);

    status.textContent =
      "❌ Could not load 7TV Paint";

    applyPaint(null);
  }
}



function updatePreview(){

  const timer =
    document.getElementById("timerPreview");

  const font =
    document.getElementById("font").value.trim();

  const size =
    document.getElementById("size").value;

  const time =
    document.getElementById("time").value;


  timer.style.fontFamily =
    `"${font}",Arial,sans-serif`;

  timer.style.fontSize =
    size + "px";

  timer.textContent =
    formatTime(
      parseTime(time)
    );


  loadPaint();
}




function generateTimer(){

  const paint =
    getPaintId(
      document.getElementById("paint").value
    );

  const font =
    document.getElementById("font").value.trim();

  const size =
    document.getElementById("size").value;

  const time =
    document.getElementById("time").value;


  const base =
    window.location.href.substring(
      0,
      window.location.href.lastIndexOf("/") + 1
    );


  const url =
    base +
    "overlay.html" +
    "?paint=" +
    encodeURIComponent(paint) +
    "&font=" +
    encodeURIComponent(font) +
    "&size=" +
    encodeURIComponent(size) +
    "&start=" +
    encodeURIComponent(time);


  document.getElementById("obsUrl").value =
    url;

  document.getElementById("output").style.display =
    "block";
}




function copyUrl(){

  const input =
    document.getElementById("obsUrl");

  navigator.clipboard.writeText(
    input.value
  );
}




updatePreview();

</script>

</body>
</html>
