<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GD0TTY'S TIMER</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at 20% 20%, rgba(0, 200, 255, .12), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(110, 70, 255, .14), transparent 35%),
        #070b14;
    color: white;
}

.container {
    width: min(1050px, calc(100% - 40px));
    margin: 0 auto;
    padding: 35px 0 60px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
}

.card {
    background: rgba(15, 21, 35, .9);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 22px;
    padding: 26px;
    box-shadow: 0 20px 70px rgba(0,0,0,.3);
}

.card h2 {
    margin: 0 0 7px;
    font-size: 20px;
}

.description {
    color: #7f8aa0;
    font-size: 13px;
    margin-bottom: 24px;
}

.input-group {
    margin-bottom: 18px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 14px 15px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.08);
    background: #0a0f1c;
    color: white;
    outline: none;
    font-family: inherit;
    font-size: 14px;
}

input:focus {
    border-color: #00c8ff;
    box-shadow: 0 0 0 3px rgba(0,200,255,.08);
}

input::placeholder {
    color: #596579;
}

.generate {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 13px;
    color: white;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    background: linear-gradient(135deg, #00bfff, #675cff);
    transition: .2s;
}

.generate:hover {
    transform: translateY(-2px);
}

.timer-preview {
    height: 300px;
    border-radius: 18px;
    background: #050811;
    border: 1px solid rgba(255,255,255,.06);

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

.timer {
    font-size: 90px;
    font-weight: 900;
    line-height: 1;
    white-space: nowrap;

    color: white;
    -webkit-text-fill-color: white;

    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;

    -webkit-background-clip: text;
    background-clip: text;
}

.paint-status {
    margin-top: 8px;
    font-size: 12px;
    color: #7f8aa0;
}

.result {
    display: none;
    margin-top: 18px;
}

.result-box {
    display: flex;
    gap: 10px;
}

.result-box input {
    flex: 1;
    min-width: 0;
}

.copy {
    border: 0;
    border-radius: 12px;
    padding: 0 20px;
    background: #151e30;
    color: white;
    font-weight: 700;
    cursor: pointer;
}

.copy:hover {
    background: #1d2940;
}

.success {
    display: none;
    margin-top: 10px;
    color: #62e6a5;
    font-size: 12px;
}

@media (max-width: 800px) {

    .container {
        width: calc(100% - 25px);
        padding-top: 20px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .timer {
        font-size: 60px;
    }
}

</style>

</head>

<body>

<div class="container">

<div class="grid">

<div class="card">

<h2>Timer Settings</h2>

<div class="description">
Configure your countdown timer and 7TV Paint.
</div>

<div class="input-group">

<label>7TV Paint ID</label>

<input
id="paintUrl"
type="text"
placeholder="Example: 01M19D4SHRVM6MWQ4PJB9TG97T"
oninput="updatePreview()"

>

<div
    class="paint-status"
    id="paintStatus"
>
Paste a 7TV Paint ID.
</div>

</div>

<div class="input-group">

<label>Google Font</label>

<input
id="fontName"
type="text"
value="Roboto"
placeholder="Example: Poppins"
oninput="updateFont()"

>

</div>

<div class="input-group">

<label>Countdown Time</label>

<input
id="startTime"
type="text"
value="10:00"
placeholder="10:00"
oninput="resetPreviewTime()"

>

</div>

<div class="input-group">

<label>Font Size</label>

<input
id="fontSize"
type="number"
value="120"
min="20"
max="500"
oninput="updateSize()"

>

</div>

<button
class="generate"
onclick="generateTimer()"

>

Generate OBS Timer </button>

<div
    class="result"
    id="result"
>

<div class="result-box">

<input
id="obsUrl"
type="text"
readonly

>

<button
class="copy"
onclick="copyUrl()"

>

Copy </button>

</div>

<div
    class="success"
    id="success"
>
✓ OBS URL copied!
</div>

</div>

</div>

<div class="card">

<h2>Live Preview</h2>

<div class="description">
Your 7TV Paint is applied directly to the countdown.
</div>

<div class="timer-preview">

<div
    class="timer"
    id="timer"
>
10:00
</div>

</div>

</div>

</div>

</div>

<script>

const timer =
    document.getElementById("timer");

const paintInput =
    document.getElementById("paintUrl");

const fontInput =
    document.getElementById("fontName");

const startInput =
    document.getElementById("startTime");

const sizeInput =
    document.getElementById("fontSize");

const paintStatus =
    document.getElementById("paintStatus");


let paintCache = {};

let paintRequest = 0;




const SEVENTV_GRAPHQL =
    "https://7tv.io/v3/gql";


async function sevenTVRequest(query) {

    const response =
        await fetch(
            SEVENTV_GRAPHQL,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json",

                    "Accept":
                        "application/json"
                },

                body: JSON.stringify({
                    query: query
                })
            }
        );


    if (!response.ok) {

        throw new Error(
            "7TV API returned " +
            response.status
        );

    }


    const json =
        await response.json();


    if (json.errors) {

        console.error(
            "7TV GraphQL errors:",
            json.errors
        );

        throw new Error(
            "7TV GraphQL error"
        );

    }


    return json.data;
}



function colorToCSS(color, opacity = 1) {

    if (!color) {

        return "rgba(255,255,255,1)";

    }


    if (typeof color === "string") {

        return color;

    }


    const r =
        Number(color.r || 0);

    const g =
        Number(color.g || 0);

    const b =
        Number(color.b || 0);

    const a =
        Number(color.a ?? 255) / 255;


    return (
        `rgba(${r},${g},${b},${a * opacity})`
    );
}




function makeStops(stops, opacity = 1) {

    if (!Array.isArray(stops)) {
        return "";
    }


    return stops
        .map(stop => {

            const color =
                colorToCSS(
                    stop.color,
                    opacity
                );


            const position =
                Number(stop.at || 0) * 100;


            return (
                `${color} ${position}%`
            );

        })
        .join(", ");
}



function layerToCSS(layer) {

    if (!layer || !layer.ty) {
        return null;
    }


    const type =
        layer.ty;


    const opacity =
        Number(
            layer.opacity ?? 1
        );


    if (
        type.__typename ===
        "PaintLayerTypeSingleColor"
    ) {

        return {
            css:
                `linear-gradient(` +
                `rgba(0,0,0,0),` +
                `${colorToCSS(type.color, opacity)}` +
                `)`,

            opacity: 1
        };

    }


    if (
        type.__typename ===
        "PaintLayerTypeLinearGradient"
    ) {

        const stops =
            makeStops(
                type.stops,
                opacity
            );


        if (!stops) {
            return null;
        }


        const prefix =
            type.repeating
                ? "repeating-"
                : "";


        return {
            css:
                `${prefix}linear-gradient(` +
                `${type.angle || 0}deg,` +
                `${stops})`,

            opacity: 1
        };

    }


    if (
        type.__typename ===
        "PaintLayerTypeRadialGradient"
    ) {

        const stops =
            makeStops(
                type.stops,
                opacity
            );


        if (!stops) {
            return null;
        }


        const prefix =
            type.repeating
                ? "repeating-"
                : "";


        const shape =
            String(
                type.shape || "CIRCLE"
            ).toLowerCase();


        return {
            css:
                `${prefix}radial-gradient(` +
                `${shape}, ${stops})`,

            opacity: 1
        };

    }


    if (
        type.__typename ===
        "PaintLayerTypeImage"
    ) {

        if (
            !Array.isArray(type.images) ||
            !type.images.length
        ) {

            return null;

        }


        const image =
            type.images[0];


        if (!image || !image.url) {
            return null;
        }


        return {
            css:
                `url("${image.url}")`,

            opacity: opacity
        };

    }


    return null;
}




function applyNewPaint(paint) {

    if (!paint) {
        return false;
    }


    const data =
        paint.data;


    if (
        !data ||
        !Array.isArray(data.layers)
    ) {

        return false;

    }


    const layers =
        data.layers;


    const backgrounds = [];


  

    [...layers]
        .reverse()
        .forEach(layer => {

            const result =
                layerToCSS(layer);


            if (!result) {
                return;
            }


            backgrounds.push(
                result.css
            );

        });


    if (!backgrounds.length) {
        return false;
    }


    timer.style.backgroundImage =
        backgrounds.join(", ");


    timer.style.backgroundSize =
        backgrounds
            .map(() => "cover")
            .join(", ");


    timer.style.backgroundPosition =
        backgrounds
            .map(() => "center")
            .join(", ");


    timer.style.backgroundRepeat =
        backgrounds
            .map(() => "no-repeat")
            .join(", ");


    timer.style.color =
        "transparent";


    timer.style.webkitTextFillColor =
        "transparent";


 

    if (
        Array.isArray(data.shadows)
    ) {

        timer.style.textShadow =
            data.shadows
                .map(shadow => {

                    return (
                        `${shadow.offsetX || 0}px ` +
                        `${shadow.offsetY || 0}px ` +
                        `${shadow.blur || 0}px ` +
                        `${colorToCSS(shadow.color)}`
                    );

                })
                .join(", ");

    } else {

        timer.style.textShadow =
            "none";

    }


    return true;
}



async function getPaint(id) {

    if (paintCache[id]) {

        return paintCache[id];

    }


 

    const query = `

        {
            paints {
                paints {

                    id
                    name

                    data {

                        layers {

                            id
                            opacity

                            ty {

                                __typename

                                ... on PaintLayerTypeSingleColor {
                                    color {
                                        r
                                        g
                                        b
                                        a
                                        hex
                                    }
                                }

                                ... on PaintLayerTypeLinearGradient {

                                    angle
                                    repeating

                                    stops {
                                        at

                                        color {
                                            r
                                            g
                                            b
                                            a
                                            hex
                                        }
                                    }
                                }

                                ... on PaintLayerTypeRadialGradient {

                                    repeating
                                    shape

                                    stops {
                                        at

                                        color {
                                            r
                                            g
                                            b
                                            a
                                            hex
                                        }
                                    }
                                }

                                ... on PaintLayerTypeImage {

                                    images {
                                        url
                                        width
                                        height
                                        mime
                                    }

                                }

                            }

                        }

                        shadows {

                            blur

                            offsetX
                            offsetY

                            color {
                                r
                                g
                                b
                                a
                                hex
                            }

                        }

                    }

                }
            }
        }

    `;


    const data =
        await sevenTVRequest(
            query
        );


    const paints =
        data?.paints?.paints;


    if (!Array.isArray(paints)) {

        throw new Error(
            "7TV returned no paints."
        );

    }


    const paint =
        paints.find(
            item =>
                String(item.id) ===
                String(id)
        );


    if (!paint) {

        throw new Error(
            "Paint ID was not found."
        );

    }


    paintCache[id] =
        paint;


    return paint;
}




function extractPaintId(value) {

    const input =
        value.trim();


    if (!input) {
        return null;
    }


   
    if (
        /^[A-Za-z0-9]+$/.test(input) &&
        input.length >= 10
    ) {

        return input;

    }


   

    try {

        const url =
            new URL(input);


        const parts =
            url.pathname
                .split("/")
                .filter(Boolean);


        return (
            parts[parts.length - 1] ||
            null
        );

    } catch {

        return null;

    }
}



async function updatePreview() {

    const value =
        paintInput.value.trim();


    if (!value) {

        timer.style.backgroundImage =
            "none";

        timer.style.color =
            "white";

        timer.style.webkitTextFillColor =
            "white";

        paintStatus.textContent =
            "Paste a 7TV Paint ID.";

        return;
    }


    const id =
        extractPaintId(value);


    if (!id) {

        paintStatus.textContent =
            "Invalid 7TV Paint ID.";

        return;

    }


    const request =
        ++paintRequest;


    paintStatus.textContent =
        "Loading 7TV Paint...";


    try {

        const paint =
            await getPaint(id);


        if (request !== paintRequest) {
            return;
        }


        const success =
            applyNewPaint(paint);


        if (!success) {

            throw new Error(
                "Paint has no renderable layers."
            );

        }


        paintStatus.textContent =
            `✓ Paint loaded: ${id}`;

    } catch (error) {

        console.error(
            "Paint loading error:",
            error
        );


        if (request !== paintRequest) {
            return;
        }


        paintStatus.textContent =
            "Could not load that 7TV Paint ID.";


        timer.style.backgroundImage =
            "none";

        timer.style.color =
            "white";

        timer.style.webkitTextFillColor =
            "white";

    }
}




function updateFont() {

    const font =
        fontInput.value.trim();


    if (!font) {
        return;
    }


    const old =
        document.getElementById(
            "googleFont"
        );


    if (old) {
        old.remove();
    }


    const link =
        document.createElement("link");


    link.id =
        "googleFont";

    link.rel =
        "stylesheet";


    link.href =
        "https://fonts.googleapis.com/css2?family=" +
        encodeURIComponent(font)
            .replace(/%20/g, "+") +
        ":wght@100;200;300;400;500;600;700;800;900&display=swap";


    document.head.appendChild(link);


    timer.style.fontFamily =
        `"${font}", sans-serif`;
}




function updateSize() {

    const size =
        sizeInput.value || 120;


    timer.style.fontSize =
        size + "px";
}




function parseTime(value) {

    const parts =
        value
            .split(":")
            .map(Number);


    if (parts.length === 2) {

        return (
            parts[0] * 60 +
            parts[1]
        );

    }


    if (parts.length === 3) {

        return (
            parts[0] * 3600 +
            parts[1] * 60 +
            parts[2]
        );

    }


    return 0;
}


function formatTime(seconds) {

    seconds =
        Math.max(
            0,
            Math.floor(seconds)
        );


    const hours =
        Math.floor(
            seconds / 3600
        );


    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );


    const secs =
        seconds % 60;


    if (hours > 0) {

        return (
            String(hours).padStart(2, "0") +
            ":" +
            String(minutes).padStart(2, "0") +
            ":" +
            String(secs).padStart(2, "0")
        );

    }


    return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(secs).padStart(2, "0")
    );
}


let remaining =
    parseTime(
        startInput.value
    );


let lastTime =
    performance.now();


function resetPreviewTime() {

    remaining =
        parseTime(
            startInput.value
        );


    lastTime =
        performance.now();


    timer.textContent =
        formatTime(
            remaining
        );
}


function runTimer() {

    const now =
        performance.now();


    const delta =
        (now - lastTime) / 1000;


    lastTime =
        now;


    if (remaining > 0) {

        remaining -= delta;


        if (remaining < 0) {
            remaining = 0;
        }

    }


    timer.textContent =
        formatTime(
            remaining
        );


    requestAnimationFrame(
        runTimer
    );
}




function generateTimer() {

    const paint =
        paintInput.value.trim();


    if (!paint) {

        alert(
            "Enter a 7TV Paint ID first!"
        );

        return;
    }


    const font =
        fontInput.value.trim();


    const start =
        startInput.value.trim();


    const size =
        sizeInput.value;


    const overlay =
        new URL(
            "overlay.html",
            window.location.href
        );


    overlay.searchParams.set(
        "paint",
        paint
    );


    overlay.searchParams.set(
        "start",
        start
    );


    overlay.searchParams.set(
        "size",
        size
    );


    overlay.searchParams.set(
        "font",
        font
    );


    overlay.searchParams.set(
        "v",
        Date.now()
    );


    document.getElementById(
        "obsUrl"
    ).value =
        overlay.href;


    document.getElementById(
        "result"
    ).style.display =
        "block";
}


function copyUrl() {

    const input =
        document.getElementById(
            "obsUrl"
        );


    navigator.clipboard.writeText(
        input.value
    );


    const success =
        document.getElementById(
            "success"
        );


    success.style.display =
        "block";


    setTimeout(() => {

        success.style.display =
            "none";

    }, 2000);
}




updateFont();

updateSize();

runTimer();

</script>

</body>
</html>
