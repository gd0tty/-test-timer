function extractPaintId(value) {

  value =
    String(value || "").trim();


  if (!value) {
    return "";
  }


  

  if (
    /^[a-zA-Z0-9_-]{10,}$/.test(value)
  ) {

    return value;

  }


  
  try {

    const url =
      new URL(value);


    const parts =
      url.pathname
        .split("/")
        .filter(Boolean);


   

    if (parts.length) {

      return parts[
        parts.length - 1
      ];

    }

  } catch (error) {

   
  }


  return value;

}



function sevenTVColorToCSS(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "rgba(255,255,255,1)";

  }


  let number =
    Number(value);


  if (
    !Number.isFinite(number)
  ) {

    return "rgba(255,255,255,1)";

  }


  

  number =
    number >>> 0;


  const r =
    (number >>> 24) & 255;

  const g =
    (number >>> 16) & 255;

  const b =
    (number >>> 8) & 255;

  const a =
    number & 255;


  return `rgba(${r},${g},${b},${(
    a / 255
  ).toFixed(3)})`;

}




function paintGradientToCSS(
  gradient
) {

  if (!gradient) {

    return "";

  }


  const stops =
    gradient.stops || [];


  if (!stops.length) {

    return "";

  }


  const stopString =
    stops
      .slice()
      .sort(
        (a,b) =>
          Number(a.at || 0) -
          Number(b.at || 0)
      )
      .map(stop => {

        const position =
          Math.max(
            0,
            Math.min(
              1,
              Number(stop.at || 0)
            )
          ) * 100;


        return (
          sevenTVColorToCSS(
            stop.color
          ) +
          " " +
          position +
          "%"
        );

      })
      .join(", ");


  const functionName =
    String(
      gradient.function ||
      "LINEAR_GRADIENT"
    ).toUpperCase();


  if (
    functionName.includes(
      "RADIAL"
    )
  ) {

    return (
      `radial-gradient(` +
      `${gradient.shape || "circle"}, ` +
      `${stopString})`
    );

  }


  const angle =
    gradient.angle !== undefined
      ? gradient.angle
      : 90;


  if (
    functionName.includes(
      "REPEATING"
    )
  ) {

    return (
      `repeating-linear-gradient(` +
      `${angle}deg, ` +
      `${stopString})`
    );

  }


  return (
    `linear-gradient(` +
    `${angle}deg, ` +
    `${stopString})`
  );

}




function applyPaint(
  paint
) {

  const preview =
    document.getElementById(
      "timerPreview"
    );


  const status =
    document.getElementById(
      "paintStatus"
    );


  if (!paint) {

    preview.style.backgroundImage =
      "";

    preview.style.backgroundColor =
      "";

    preview.style.color =
      "white";

    preview.style.webkitTextFillColor =
      "white";

    preview.style.filter =
      "";

    preview.style.textShadow =
      "";

    preview.style.webkitTextStroke =
      "";

    status.textContent =
      "No paint loaded — using normal text";

    status.className =
      "paint-status";

    return;

  }


  

  let gradients =
    paint.gradients || [];


  if (
    !gradients.length &&
    paint.function
  ) {

    gradients = [{

      function:
        paint.function,

      shape:
        paint.shape,

      image_url:
        paint.image_url,

      stops:
        paint.stops || [],

      angle:
        paint.angle,

      repeat:
        paint.repeat

    }];

  }


  const cssGradients =
    gradients
      .map(
        paintGradientToCSS
      )
      .filter(Boolean);


  
  if (
    paint.image_url &&
    (
      String(
        paint.function || ""
      ).toUpperCase()
        .includes("URL")
      ||
      !cssGradients.length
    )
  ) {

    cssGradients.push(
      `url("${paint.image_url}")`
    );

  }


  if (cssGradients.length) {

    preview.style.backgroundImage =
      cssGradients.join(", ");

    preview.style.backgroundSize =
      gradients
        .map(
          g =>
            g.size
              ? `${g.size[0] || 1}px ${g.size[1] || 1}px`
              : "cover"
        )
        .join(", ");

    preview.style.backgroundRepeat =
      gradients
        .map(
          g =>
            g.repeat
              ? "repeat"
              : "no-repeat"
        )
        .join(", ");


    

    preview.style.backgroundClip =
      "text";

    preview.style.webkitBackgroundClip =
      "text";

    preview.style.color =
      "transparent";

    preview.style.webkitTextFillColor =
      "transparent";

  } else {

    if (paint.color !== undefined) {

      const color =
        sevenTVColorToCSS(
          paint.color
        );

      preview.style.backgroundImage =
        "";

      preview.style.color =
        color;

      preview.style.webkitTextFillColor =
        color;

    }

  }


 

  if (paint.text) {

    if (
      paint.text.weight
    ) {

      preview.style.fontWeight =
        Number(
          paint.text.weight
        ) * 100;

    }


    if (
      paint.text.transform
    ) {

      preview.style.textTransform =
        paint.text.transform;

    }


    if (
      paint.text.stroke
    ) {

      const stroke =
        paint.text.stroke;


      preview.style.webkitTextStroke =
        `${stroke.width || 0}px ` +
        sevenTVColorToCSS(
          stroke.color
        );

    }


    if (
      paint.text.shadows
    ) {

      preview.style.textShadow =
        paint.text.shadows
          .map(shadow => {

            return (
              `${shadow.x_offset || 0}px ` +
              `${shadow.y_offset || 0}px ` +
              `${shadow.radius || 0}px ` +
              `${sevenTVColorToCSS(
                shadow.color
              )}`
            );

          })
          .join(", ");

    }

  }


  

  if (
    paint.shadows &&
    paint.shadows.length
  ) {

    preview.style.filter =
      paint.shadows
        .map(shadow => {

          return (
            `drop-shadow(` +
            `${shadow.x_offset || 0}px ` +
            `${shadow.y_offset || 0}px ` +
            `${shadow.radius || 0}px ` +
            `${sevenTVColorToCSS(
              shadow.color
            )})`
          );

        })
        .join(" ");

  }


  status.textContent =
    "✅ 7TV Paint loaded";

  status.className =
    "paint-status success";

}




async function load7TVPaint() {

  const value =
    document.getElementById(
      "paint"
    ).value.trim();


  const id =
    extractPaintId(value);


  const status =
    document.getElementById(
      "paintStatus"
    );


  if (!id) {

    applyPaint(null);

    return;

  }


  status.textContent =
    "Loading 7TV Paint...";

  status.className =
    "paint-status";


  try {

   

    const response =
      await fetch(
        `https://7tv.io/v3/cosmetics/paint/${encodeURIComponent(id)}`
      );


    if (
      response.ok
    ) {

      const paint =
        await response.json();


      applyPaint(paint);

      return;

    }


    

    const allResponse =
      await fetch(
        "https://7tv.io/v3/cosmetics"
      );


    if (
      allResponse.ok
    ) {

      const all =
        await allResponse.json();


      const paints =
        all.paints || [];


      const found =
        paints.find(
          paint =>
            String(
              paint.id
            ) === String(id)
        );


      if (found) {

        applyPaint(found);

        return;

      }

    }


    throw new Error(
      "Paint not found"
    );

  } catch (error) {

    console.error(
      "7TV paint error:",
      error
    );


    

    applyPaint(null);


    status.textContent =
      "⚠️ Could not load that 7TV Paint";

    status.className =
      "paint-status error";

  }

}




let paintLoadTimer = null;


function updatePreview() {

  const preview =
    document.getElementById(
      "timerPreview"
    );


  const font =
    document.getElementById(
      "font"
    ).value.trim();


  const size =
    Number(
      document.getElementById(
        "size"
      ).value
    ) || 150;


  const time =
    document.getElementById(
      "time"
    ).value;


  

  if (font) {

    preview.style.fontFamily =
      `"${font}", Arial, sans-serif`;

  }


  

  preview.style.fontSize =
    `${size}px`;


  

  previewSeconds =
    Math.max(
      0,
      parseTime(time) / 1000
    );


  preview.textContent =
    formatPreviewTime(
      previewSeconds
    );


 

  clearTimeout(
    paintLoadTimer
  );


  paintLoadTimer =
    setTimeout(
      load7TVPaint,
      350
    );

}




function formatPreviewTime(
  totalSeconds
) {

  totalSeconds =
    Math.max(
      0,
      Math.floor(
        totalSeconds
      )
    );


  const minutes =
    Math.floor(
      totalSeconds / 60
    );


  const seconds =
    totalSeconds % 60;


  return (
    String(minutes)
      .padStart(2,"0") +
    ":" +
    String(seconds)
      .padStart(2,"0")
  );

}




function syncPreviewFromTimer() {

  const remaining =
    getCurrentRemaining();


  previewSeconds =
    remaining / 1000;


  const preview =
    document.getElementById(
      "timerPreview"

  preview.textContent =
    formatPreviewTime(
      previewSeconds
    );

}


setInterval(

  );


  const {

  } =
    await supabaseClient.auth.signUp({

      email:
        email,

      password:

    );

    setAuthStatus(
      "Account created! Check your email to confirm it, then log in."

function getCurrentRemaining() {

  if (!timerState.running) {

    return Number(
      timerState.remaining_ms
    );

  }


  const updated =
    new Date(
      timerState.updated_at
    ).getTime();


  const elapsed =
    Date.now() -
    updated;


  return Math.max(

    0,

    Number(
      timerState.remaining_ms
    ) -
    elapsed

  );

}


async function saveTimer(
  remaining,
  running
) {

  const {
    data: {
      user
    }
  } =
    await supabaseClient.auth.getUser();


  if (!user) {

    setAuthStatus(
      "You must be logged in to control the timer."
    );

    return;

  }


  const row = {

    id:
      "main",

    remaining_ms:
      Math.max(
        0,
        Math.round(
          remaining
        )
      ),

    running:
      running,

    updated_at:
      new Date().toISOString()

  };


  const {
    error
  } =
    await supabaseClient
      .from("timers")
      .upsert(row);


  if (error) {

    console.error(error);

    document.getElementById(
      "status"
    ).textContent =
      "Supabase error: " +
      error.message;

    return;

  }


  

  timerState =
    row;


  syncPreviewFromTimer();


  document.getElementById(
    "status"
  ).textContent =
    running
      ? "▶ Timer running"
      : "⏸ Timer paused";

}


async function startTimer() {

  const remaining =
    getCurrentRemaining();


  await saveTimer(

    true
  );

}


async function pauseTimer() {

  const remaining =
    getCurrentRemaining();


  await saveTimer(
    remaining,
    false
  );

}


async function addTime(
  amount
) {

  const remaining =
    getCurrentRemaining();

    timerState.running

}


async function resetTimer() {

  const time =
    parseTime(
      document.getElementById(
        "time"
      ).value
    );


  await saveTimer(
    time,
    false
  );

}


async function setExactTime() {

  const value =
    document.getElementById(
      "exactTime"
    ).value;


  const time =
    parseTime(value);


  await saveTimer(
    time,
    false
  );

}


function parseTime(
  value
) {

  const parts =
    String(value || "")
      .split(":")
      .map(Number);


  if (
    parts.length === 2
  ) {

    const minutes =
      parts[0] || 0;

    const seconds =
      parts[1] || 0;


    return (

      minutes * 60 +

      seconds

    ) * 1000;

  }


  if (
    parts.length === 1 &&
    Number.isFinite(parts[0])
  ) {

    return (
      parts[0] * 1000
    );

  }


  return 600000;

}
