<!DOCTYPE html>

<html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GD0TTY'S TIMER</title>

<style> * { box-sizing: border-box; } html, body { margin: 0; padding: 0; min-height: 100%; } body { font-family: Arial, sans-serif; background: radial-gradient(circle at 20% 20%, rgba(0, 200, 255, .12), transparent 35%), radial-gradient(circle at 80% 80%, rgba(110, 70, 255, .14), transparent 35%), #070b14; color: white; } .container { width: min(1050px, calc(100% - 40px)); margin: 0 auto; padding: 35px 0 60px; } .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; } .card { background: rgba(15, 21, 35, .9); border: 1px solid rgba(255,255,255,.08); border-radius: 22px; padding: 26px; box-shadow: 0 20px 70px rgba(0,0,0,.3); } .card h2 { margin: 0 0 7px; font-size: 20px; } .description { color: #7f8aa0; font-size: 13px; margin-bottom: 24px; } .input-group { margin-bottom: 18px; } label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; } input { width: 100%; padding: 14px 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,.08); background: #0a0f1c; color: white; outline: none; font-family: inherit; font-size: 14px; } input:focus { border-color: #00c8ff; box-shadow: 0 0 0 3px rgba(0,200,255,.08); } input::placeholder { color: #596579; } .generate { width: 100%; padding: 15px; border: 0; border-radius: 13px; color: white; font-size: 15px; font-weight: 800; cursor: pointer; background: linear-gradient(135deg, #00bfff, #675cff); transition: .2s; } .generate:hover { transform: translateY(-2px); } .timer-preview { height: 300px; border-radius: 18px; background: #050811; border: 1px solid rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center; overflow: hidden; } .timer { font-size: 90px; font-weight: 900; line-height: 1; white-space: nowrap; color: white; -webkit-text-fill-color: white; background-image: none; background-repeat: no-repeat; background-position: center; background-size: cover; -webkit-background-clip: text; background-clip: text; } .paint-status { margin-top: 8px; font-size: 12px; color: #7f8aa0; } .result { display: none; margin-top: 18px; } .result-box { display: flex; gap: 10px; } .result-box input { flex: 1; min-width: 0; } .copy { border: 0; border-radius: 12px; padding: 0 20px; background: #151e30; color: white; font-weight: 700; cursor: pointer; } .copy:hover { background: #1d2940; } .success { display: none; margin-top: 10px; color: #62e6a5; font-size: 12px; } @media (max-width: 800px) { .container { width: calc(100% - 25px); padding-top: 20px; } .grid { grid-template-columns: 1fr; } .timer { font-size: 60px; } } </style>

</head>

<body>

<div class="container">

<div class="grid">

    <div class="card">

        <h2>Timer Settings</h2>

        <div class="description">
            Configure your countdown timer and 7TV Paint.
        </div>

        <div class="input-group">

            <label>7TV Paint ID</label>

            <input
                id="paintUrl"
                type="text"
                placeholder="Example: 01M19D4SHRVM6MWQ4PJB9TG97T"
                oninput="updatePreview()"
            >

            <div class="paint-status" id="paintStatus">
                Paste a 7TV Paint ID.
            </div>

        </div>

        <div class="input-group">

            <label>Google Font</label>

            <input
                id="fontName"
                type="text"
                value="Roboto"
                placeholder="Example: Poppins"
                oninput="updateFont()"
            >

        </div>

        <div class="input-group">

            <label>Countdown Time</label>

            <input
                id="startTime"
                type="text"
                value="10:00"
                placeholder="10:00"
                oninput="resetPreviewTime()"
            >

        </div>

        <div class="input-group">

            <label>Font Size</label>

            <input
                id="fontSize"
                type="number"
                value="120"
                min="20"
                max="500"
                oninput="updateSize()"
            >

        </div>

        <button
            class="generate"
            onclick="generateTimer()"
        >
            Generate OBS Timer
        </button>

        <div
            class="result"
            id="result"
        >

            <div class="result-box">

                <input
                    id="obsUrl"
                    type="text"
                    readonly
                >

                <button
                    class="copy"
                    onclick="copyUrl()"
                >
                    Copy
                </button>

            </div>

            <div
                class="success"
                id="success"
            >
                ✓ OBS URL copied!
            </div>

        </div>

    </div>

    <div class="card">

        <h2>Live Preview</h2>

        <div class="description">
            Your 7TV Paint is applied directly to the countdown.
        </div>

        <div class="timer-preview">

            <div
                class="timer"
                id="timer"
            >
                10:00
            </div>

        </div>

    </div>

</div>

</div>

<script> const timer = document.getElementById("timer"); const paintInput = document.getElementById("paintUrl"); const fontInput = document.getElementById("fontName"); const startInput = document.getElementById("startTime"); const sizeInput = document.getElementById("fontSize"); const paintStatus = document.getElementById("paintStatus"); let paintCache = {}; let paintRequest = 0; /function colorToCSS(value) { if (typeof value === "string") { return value; } if (typeof value !== "number") { return "rgba(255,255,255,1)"; } const unsigned = value >>> 0; const r = (unsigned >>> 24) & 255; const g = (unsigned >>> 16) & 255; const b = (unsigned >>> 8) & 255; const a = unsigned & 255; return `rgba(${r}, ${g}, ${b}, ${a / 255})`; } function normalizePaint(paint) { if (!paint) return null; if (paint.data) { return { id: paint.id, ...paint.data }; } return paint; } function gradientToCSS(gradient) { if (!gradient) return null; const fn = String( gradient.function || gradient.type || "" ).toUpperCase(); if (fn === "URL") { if (!gradient.image_url) { return null; } return `url("${gradient.image_url}")`; } const stops = Array.isArray(gradient.stops) ? gradient.stops .map(stop => { const color = colorToCSS(stop.color); const position = Math.max( 0, Math.min( 100, (Number(stop.at) || 0) * 100 ) ); return `${color} ${position}%`; }) .join(", ") : ""; if (!stops) return null; if (fn === "RADIAL_GRADIENT") { const shape = String( gradient.shape || "circle" ).toLowerCase(); return ( (gradient.repeat ? "repeating-" : "") + `radial-gradient(${shape}, ${stops})` ); } return ( (gradient.repeat ? "repeating-" : "") + `linear-gradient(${Number(gradient.angle) || 0}deg, ${stops})` ); } function applyPaint(paint) { const data = normalizePaint(paint); if (!data) { timer.style.backgroundImage = "none"; timer.style.color = "white"; timer.style.webkitTextFillColor = "white"; return; } let gradients = Array.isArray(data.gradients) ? data.gradients : []; /* Old/static 7TV paint format. Convert the old fields into one gradient. */ if ( !gradients.length && data.function ) { gradients = [{ function: data.function, angle: data.angle, shape: data.shape, image_url: data.image_url, stops: data.stops || [], repeat: data.repeat || false, canvas_repeat: data.canvas_repeat }]; } const backgrounds = gradients .map(gradientToCSS) .filter(Boolean); if (backgrounds.length) { timer.style.backgroundImage = backgrounds.join(", "); timer.style.backgroundPosition = gradients .map(g => { if ( Array.isArray(g.at) && g.at.length === 2 ) { return ( `${g.at[0] * 100}% ` + `${g.at[1] * 100}%` ); } return "center"; }) .join(", "); timer.style.backgroundSize = gradients .map(g => { if ( Array.isArray(g.size) && g.size.length === 2 ) { return ( `${g.size[0] * 100}% ` + `${g.size[1] * 100}%` ); } return "cover"; }) .join(", "); timer.style.backgroundRepeat = gradients .map(g => g.canvas_repeat || "no-repeat" ) .join(", "); timer.style.color = "transparent"; timer.style.webkitTextFillColor = "transparent"; } else if (data.color) { timer.style.backgroundImage = "none"; timer.style.color = colorToCSS(data.color); timer.style.webkitTextFillColor = colorToCSS(data.color); } /* 7TV paint text settings */ if (data.text) { if (data.text.weight) { timer.style.fontWeight = String( data.text.weight * 100 ); } if (data.text.stroke) { timer.style.webkitTextStroke = `${data.text.stroke.width || 0}px ` + `${colorToCSS(data.text.stroke.color)}`; } if (data.text.shadows) { timer.style.textShadow = data.text.shadows .map(shadow => { return ( `${shadow.x_offset || 0}px ` + `${shadow.y_offset || 0}px ` + `${shadow.radius || 0}px ` + `${colorToCSS(shadow.color)}` ); }) .join(", "); } if (data.text.transform) { timer.style.textTransform = data.text.transform; } } /* 7TV paint shadows */ if (Array.isArray(data.shadows)) { timer.style.filter = data.shadows .map(shadow => { return ( `drop-shadow(` + `${shadow.x_offset || 0}px ` + `${shadow.y_offset || 0}px ` + `${shadow.radius || 0}px ` + `${colorToCSS(shadow.color)}` + `)` ); }) .join(" "); } } /* ========================= LOAD PAINT BY ID ========================= */ function extractPaintId(value) { const input = value.trim(); if (!input) return null; /* Raw Paint ID */ if ( /^[A-Za-z0-9]+$/.test(input) && input.length >= 10 ) { return input; } /* 7TV URL containing the ID */ try { const url = new URL(input); const parts = url.pathname .split("/") .filter(Boolean); return parts[parts.length - 1] || null; } catch { return null; } } async function getPaint(id) { if (paintCache[id]) { return paintCache[id]; } const response = await fetch( "https://7tv.io/v3/gql" ); if (!response.ok) { throw new Error( "Could not load 7TV cosmetics." ); } const json = await response.json(); let paints = []; if (Array.isArray(json)) { paints = json; } else if ( Array.isArray(json.paints) ) { paints = json.paints; } else if ( json.cosmetics && Array.isArray(json.cosmetics.paints) ) { paints = json.cosmetics.paints; } const paint = paints.find( item => String(item.id) === String(id) ); if (!paint) { throw new Error( "Paint ID was not found." ); } paintCache[id] = paint; return paint; } /* ========================= PREVIEW ========================= */ async function updatePreview() { const value = paintInput.value.trim(); if (!value) { timer.style.backgroundImage = "none"; timer.style.color = "white"; timer.style.webkitTextFillColor = "white"; paintStatus.textContent = "Paste a 7TV Paint ID."; return; } const id = extractPaintId(value);  if ( /^https?:\/\//i.test(value) && !id ) { timer.style.backgroundImage = `url("${value}")`; timer.style.color = "transparent"; timer.style.webkitTextFillColor = "transparent"; paintStatus.textContent = "Image URL loaded."; return; } if (!id) { paintStatus.textContent = "Invalid 7TV Paint ID."; return; } const request = ++paintRequest; paintStatus.textContent = "Loading 7TV Paint..."; try { const paint = await getPaint(id); if (request !== paintRequest) { return; } applyPaint(paint); paintStatus.textContent = `Paint loaded: ${id}`; } catch (error) { if (request !== paintRequest) { return; } paintStatus.textContent = "Could not find that 7TV Paint ID."; timer.style.backgroundImage = "none"; timer.style.color = "white"; timer.style.webkitTextFillColor = "white"; } } function updateFont() { const font = fontInput.value.trim(); if (!font) return; const old = document.getElementById( "googleFont" ); if (old) { old.remove(); } const link = document.createElement("link"); link.id = "googleFont"; link.rel = "stylesheet"; link.href = "https://fonts.googleapis.com/css2?family=" + encodeURIComponent(font).replace(/%20/g, "+") + ":wght@100;200;300;400;500;600;700;800;900&display=swap"; document.head.appendChild(link); timer.style.fontFamily = `"${font}", sans-serif`; }  function updateSize() { const size = sizeInput.value || 120; timer.style.fontSize = size + "px"; } function parseTime(value) { const parts = value .split(":") .map(Number); if (parts.length === 2) { return ( parts[0] * 60 + parts[1] ); } if (parts.length === 3) { return ( parts[0] * 3600 + parts[1] * 60 + parts[2] ); } return 0; } function formatTime(seconds) { seconds = Math.max( 0, Math.floor(seconds) ); const hours = Math.floor( seconds / 3600 ); const minutes = Math.floor( (seconds % 3600) / 60 ); const secs = seconds % 60; if (hours > 0) { return ( String(hours).padStart(2, "0") + ":" + String(minutes).padStart(2, "0") + ":" + String(secs).padStart(2, "0") ); } return ( String(minutes).padStart(2, "0") + ":" + String(secs).padStart(2, "0") ); } let remaining = parseTime( startInput.value ); let lastTime = performance.now(); function resetPreviewTime() { remaining = parseTime( startInput.value ); lastTime = performance.now(); timer.textContent = formatTime( remaining ); } function runTimer() { const now = performance.now(); const delta = (now - lastTime) / 1000; lastTime = now; if (remaining > 0) { remaining -= delta; if (remaining < 0) { remaining = 0; } } timer.textContent = formatTime( remaining ); requestAnimationFrame( runTimer ); }  function generateTimer() { const paint = paintInput.value.trim(); if (!paint) { alert( "Enter a 7TV Paint ID first!" ); return; } const font = fontInput.value.trim(); const start = startInput.value.trim(); const size = sizeInput.value; const overlay = new URL( "overlay.html", window.location.href ); overlay.searchParams.set( "paint", paint ); overlay.searchParams.set( "start", start ); overlay.searchParams.set( "size", size ); overlay.searchParams.set( "font", font ); overlay.searchParams.set( "v", Date.now() ); document.getElementById( "obsUrl" ).value = overlay.href; document.getElementById( "result" ).style.display = "block"; } function copyUrl() { const input = document.getElementById( "obsUrl" ); navigator.clipboard.writeText( input.value ); const success = document.getElementById( "success" ); success.style.display = "block"; setTimeout(() => { success.style.display = "none"; }, 2000); }  updateFont(); updateSize(); runTimer(); </script>

</body> </html>
