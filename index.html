<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GD0TTY'S TIMER</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:#0d0d12;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.card{
    width:100%;
    max-width:650px;
    background:#17171f;
    border:1px solid #292934;
    border-radius:18px;
    padding:28px;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
}

h1{
    margin:0 0 8px;
    font-size:28px;
}

.sub{
    color:#92929f;
    margin-bottom:25px;
}

label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin:16px 0 7px;
}

input,select{
    width:100%;
    padding:12px 13px;
    border-radius:10px;
    border:1px solid #30303b;
    background:#101016;
    color:white;
    outline:none;
    font-size:14px;
}

input:focus,select:focus{
    border-color:#6666ff;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

button{
    width:100%;
    margin-top:20px;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#625cff;
    color:#fff;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
}

button:hover{
    background:#746eff;
}

.status{
    margin-top:12px;
    min-height:20px;
    color:#8f8f9c;
    font-size:13px;
}

.previewBox{
    margin-top:25px;
    padding:25px 15px;
    min-height:130px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        linear-gradient(45deg,#202028 25%,transparent 25%),
        linear-gradient(-45deg,#202028 25%,transparent 25%),
        linear-gradient(45deg,transparent 75%,#202028 75%),
        linear-gradient(-45deg,transparent 75%,#202028 75%);
    background-size:20px 20px;
    background-position:0 0,0 10px,10px -10px,-10px 0;
    border-radius:12px;
    overflow:hidden;
}

#preview{
    font-weight:900;
    line-height:1;
    text-align:center;
    background-clip:text;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
}

.obs{
    margin-top:20px;
    display:none;
}

.obs input{
    margin-top:7px;
}

.copy{
    background:#252530;
    margin-top:8px;
}

.copy:hover{
    background:#333341;
}

.small{
    margin-top:14px;
    font-size:12px;
    color:#70707c;
    line-height:1.5;
}
</style>
</head>

<body>

<div class="card">

    <h1>7TV Paint Timer</h1>
    <div class="sub">Create a transparent countdown timer using a 7TV Paint.</div>

    <label>7TV Paint ID</label>
    <input
        id="paintId"
        placeholder="Paste your 7TV Paint ID"
        autocomplete="off"
    >

    <div class="row">

        <div>
            <label>Countdown</label>
            <input
                id="countdown"
                value="10"
                type="number"
                min="1"
            >
        </div>

        <div>
            <label>Font Size</label>
            <input
                id="fontSize"
                value="120"
                type="number"
                min="10"
            >
        </div>

    </div>

    <label>Font</label>
    <input
        id="font"
        value="Arial"
        placeholder="Arial"
    >

    <button id="generate">Generate OBS URL</button>

    <div class="status" id="status">
        Enter a 7TV Paint ID to preview it.
    </div>

    <div class="previewBox">
        <div id="preview">10</div>
    </div>

    <div class="obs" id="obsBox">

        <label>OBS Browser Source URL</label>

        <input id="obsUrl" readonly>

        <button class="copy" id="copyBtn">
            Copy OBS URL
        </button>

    </div>

    <div class="small">
        The OBS overlay is transparent. Put the generated URL into an OBS Browser Source.
    </div>

</div>

<script>
const API = "https://api.7tv.dev/v3/gql";

const paintCache = new Map();

const paintQuery = `
query {
    paints {
        paints {
            id
            name
            data {
                layers {
                    id
                    opacity
                    ty {
                        __typename

                        ... on PaintLayerTypeSingleColor {
                            color {
                                r
                                g
                                b
                                a
                                hex
                            }
                        }

                        ... on PaintLayerTypeLinearGradient {
                            angle
                            repeating
                            stops {
                                at
                                color {
                                    r
                                    g
                                    b
                                    a
                                    hex
                                }
                            }
                        }

                        ... on PaintLayerTypeRadialGradient {
                            repeating
                            shape
                            stops {
                                at
                                color {
                                    r
                                    g
                                    b
                                    a
                                    hex
                                }
                            }
                        }

                        ... on PaintLayerTypeImage {
                            images {
                                url
                                width
                                height
                                mime
                            }
                        }
                    }
                }

                shadows {
                    blur
                    offsetX
                    offsetY
                    color {
                        r
                        g
                        b
                        a
                        hex
                    }
                }
            }
        }
    }
}
`;

function extractPaintId(value){
    value = String(value || "").trim();

    if(!value) return "";

    try{
        const url = new URL(value);

        const parts = url.pathname
            .split("/")
            .filter(Boolean);

        const possible = parts[parts.length - 1];

        if(possible && /^[A-Za-z0-9]+$/.test(possible)){
            return possible;
        }
    }catch(e){}

    return value;
}

function rgba(color, opacity = 1){
    if(!color) return "rgba(255,255,255,1)";

    const a =
        typeof color.a === "number"
            ? color.a / 255
            : 1;

    return `rgba(
        ${color.r || 0},
        ${color.g || 0},
        ${color.b || 0},
        ${Math.max(0,Math.min(1,a * opacity))}
    )`;
}

function stopColor(stop, opacity){
    return rgba(stop.color, opacity);
}

function layerToCSS(layer){

    const opacity =
        typeof layer.opacity === "number"
            ? layer.opacity
            : 1;

    const type = layer.ty;

    if(!type) return null;

    if(type.__typename === "PaintLayerTypeSingleColor"){

        const c = rgba(type.color, opacity);

        return {
            image:`linear-gradient(${c},${c})`,
            size:"100% 100%",
            repeat:"no-repeat"
        };
    }

    if(type.__typename === "PaintLayerTypeLinearGradient"){

        const stops = (type.stops || [])
            .map(s =>
                `${stopColor(s,opacity)} ${s.at * 100}%`
            )
            .join(",");

        const fn =
            type.repeating
                ? "repeating-linear-gradient"
                : "linear-gradient";

        return {
            image:`${fn}(${type.angle || 0}deg,${stops})`,
            size:"100% 100%",
            repeat:"no-repeat"
        };
    }

    if(type.__typename === "PaintLayerTypeRadialGradient"){

        const stops = (type.stops || [])
            .map(s =>
                `${stopColor(s,opacity)} ${s.at * 100}%`
            )
            .join(",");

        const fn =
            type.repeating
                ? "repeating-radial-gradient"
                : "radial-gradient";

        const shape =
            type.shape === "ELLIPSE"
                ? "ellipse"
                : "circle";

        return {
            image:`${fn}(${shape},${stops})`,
            size:"100% 100%",
            repeat:"no-repeat"
        };
    }

    if(type.__typename === "PaintLayerTypeImage"){

        const img =
            type.images &&
            type.images.length
                ? type.images[0]
                : null;

        if(!img) return null;

        return {
            image:`url("${img.url}")`,
            size:"cover",
            repeat:"no-repeat"
        };
    }

    return null;
}

function paintToCSS(paint){

    const layers =
        paint?.data?.layers || [];

    const rendered =
        layers
            .map(layerToCSS)
            .filter(Boolean);

    return {
        images: rendered.map(x => x.image),
        sizes: rendered.map(x => x.size),
        repeats: rendered.map(x => x.repeat)
    };
}

async function getPaint(id){

    id = extractPaintId(id);

    if(!id) throw new Error("Missing Paint ID");

    if(paintCache.has(id)){
        return paintCache.get(id);
    }

  

    const response = await fetch(API,{
        method:"POST",
        headers:{
            "Content-Type":"application/json",
            "Accept":"application/json"
        },
        body:JSON.stringify({
            query:paintQuery
        })
    });

    if(!response.ok){
        throw new Error(`7TV API HTTP ${response.status}`);
    }

    const json = await response.json();

    if(json.errors && json.errors.length){
        throw new Error(
            json.errors
                .map(x => x.message)
                .join(", ")
        );
    }

    const paints =
        json?.data?.paints?.paints || [];

    const paint =
        paints.find(
            p => String(p.id).toLowerCase() === id.toLowerCase()
        );

    if(!paint){
        throw new Error("Paint ID not found");
    }

    paintCache.set(id,paint);

    return paint;
}

function applyPaint(element,paint){

    const css = paintToCSS(paint);

    element.style.backgroundImage =
        css.images.length
            ? css.images.join(",")
            : "none";

    element.style.backgroundSize =
        css.sizes.length
            ? css.sizes.join(",")
            : "100% 100%";

    element.style.backgroundRepeat =
        css.repeats.length
            ? css.repeats.join(",")
            : "no-repeat";

    element.style.backgroundPosition =
        css.images.map(() => "center").join(",");

    const shadows =
        paint?.data?.shadows || [];

    if(shadows.length){

        element.style.filter =
            shadows.map(s =>
                `drop-shadow(
                    ${s.offsetX || 0}px
                    ${s.offsetY || 0}px
                    ${s.blur || 0}px
                    ${rgba(s.color)}
                )`
            ).join(" ");
    }else{
        element.style.filter = "none";
    }
}

const paintInput = document.getElementById("paintId");
const countdownInput = document.getElementById("countdown");
const fontSizeInput = document.getElementById("fontSize");
const fontInput = document.getElementById("font");
const preview = document.getElementById("preview");
const status = document.getElementById("status");
const obsBox = document.getElementById("obsBox");
const obsUrl = document.getElementById("obsUrl");

let currentPaint = null;
let requestNumber = 0;

function updateBasicPreview(){

    preview.textContent =
        Math.max(0,parseInt(countdownInput.value) || 0);

    preview.style.fontSize =
        `${Math.max(10,parseInt(fontSizeInput.value) || 120)}px`;

    preview.style.fontFamily =
        fontInput.value.trim() || "Arial";
}

async function updatePaintPreview(){

    const id = extractPaintId(paintInput.value);

    updateBasicPreview();

    if(!id){
        currentPaint = null;
        preview.style.backgroundImage = "none";
        preview.style.webkitTextFillColor = "#fff";
        preview.style.color = "#fff";

        status.textContent =
            "Enter a 7TV Paint ID to preview it.";

        return;
    }

    const request = ++requestNumber;

    status.textContent = "Loading 7TV Paint...";

    try{

        const paint = await getPaint(id);

        if(request !== requestNumber) return;

        currentPaint = paint;

        preview.style.webkitTextFillColor =
            "transparent";

        preview.style.color =
            "transparent";

        applyPaint(preview,paint);

        status.textContent =
            `Loaded: ${paint.name || paint.id}`;

    }catch(error){

        if(request !== requestNumber) return;

        currentPaint = null;

        preview.style.backgroundImage = "none";
        preview.style.webkitTextFillColor = "#fff";
        preview.style.color = "#fff";

        status.textContent =
            `7TV Paint error: ${error.message}`;
    }
}

function buildOverlayURL(){

    const base =
        window.location.href
            .replace(/index\.html?$/i,"")
            .replace(/\/$/,"");

    const id =
        extractPaintId(paintInput.value);

    const seconds =
        Math.max(
            1,
            parseInt(countdownInput.value) || 10
        );

    const size =
        Math.max(
            10,
            parseInt(fontSizeInput.value) || 120
        );

    const font =
        fontInput.value.trim() || "Arial";

    return `${base}/overlay.html?paint=${encodeURIComponent(id)}&time=${seconds}&size=${size}&font=${encodeURIComponent(font)}`;
}

document.getElementById("generate").addEventListener("click",async()=>{

    const id = extractPaintId(paintInput.value);

    if(!id){
        status.textContent = "Enter a 7TV Paint ID first.";
        return;
    }

    status.textContent = "Checking Paint...";

    try{

        await getPaint(id);

        const url = buildOverlayURL();

        obsUrl.value = url;
        obsBox.style.display = "block";

        status.textContent =
            "Done! Add this URL as an OBS Browser Source.";

    }catch(error){

        status.textContent =
            `Could not load Paint: ${error.message}`;
    }
});

document.getElementById("copyBtn").addEventListener("click",async()=>{

    try{
        await navigator.clipboard.writeText(obsUrl.value);

        document.getElementById("copyBtn").textContent =
            "Copied!";

        setTimeout(()=>{
            document.getElementById("copyBtn").textContent =
                "Copy OBS URL";
        },1500);

    }catch(e){
        obsUrl.select();
        document.execCommand("copy");
    }
});

paintInput.addEventListener("input",updatePaintPreview);
countdownInput.addEventListener("input",updateBasicPreview);
fontSizeInput.addEventListener("input",updateBasicPreview);
fontInput.addEventListener("input",updateBasicPreview);

updateBasicPreview();
</script>

</body>
</html>
