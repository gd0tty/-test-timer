<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GD0TTY'S TIMER</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(0, 200, 255, .15), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(120, 70, 255, .15), transparent 35%),
        #080b12;
      color: white;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 35px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .card {
      background: rgba(18, 23, 35, .85);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }

    .full {
      grid-column: 1 / -1;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      color: #cbd5e1;
    }

    input {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #303747;
      background: #0d111b;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #22d3ee;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 18px;
      margin: 5px;
      color: white;
      background: linear-gradient(135deg, #06b6d4, #6366f1);
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.1);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .output {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: #0b101a;
    }

    .status {
      text-align: center;
      margin-top: 15px;
      color: #94a3b8;
    }

    @media(max-width: 750px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Timer Generator</h1>
  <div class="subtitle">Create an OBS timer with 7TV Paint effects</div>

  <div class="grid">

    <div class="card">

      <h2>Timer Settings</h2>

      <label>7TV Paint ID or URL</label>
      <input id="paint" placeholder="Paste 7TV Paint ID or URL">

      <label>Google Font</label>
      <input id="font" value="Arial">

      <label>Countdown Time</label>
      <input id="time" value="10:00">

      <label>Font Size</label>
      <input id="size" type="number" value="150">

      <button onclick="generateTimer()">
        Generate OBS Timer
      </button>

      <div class="output" id="output">
        <label>OBS Browser Source URL</label>
        <input id="obsUrl" readonly>

        <button onclick="copyUrl()">Copy URL</button>
      </div>

    </div>


    <div class="card">

      <h2>Timer Controls</h2>

      <div class="controls">
        <button onclick="startTimer()">▶ Start</button>
        <button onclick="pauseTimer()">⏸ Pause</button>
        <button onclick="addTime(10000)">+10 Seconds</button>
        <button onclick="addTime(-10000)">-10 Seconds</button>
        <button onclick="resetTimer()">Reset</button>
      </div>

      <label>Set Exact Time</label>
      <input id="exactTime" placeholder="Example: 5:00">

      <button onclick="setExactTime()">
        Set Time
      </button>

      <div class="status" id="status">
        Connecting...
      </div>

    </div>

  </div>
</div>


<script>

const SUPABASE_URL =
  "https://hkqieahernxlupambubz.supabase.co";

/*
  PASTE YOUR SUPABASE PUBLISHABLE KEY BETWEEN THE QUOTES BELOW.
*/
const SUPABASE_KEY =
  "sb_publishable_Ueiqs7cgDOi13Qj9rVL_9g_AfvCB9ht";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let timerState = {
  id: "main",
  remaining_ms: 600000,
  running: false,
  updated_at: new Date().toISOString()
};


function getCurrentRemaining() {

  if (!timerState.running) {
    return Number(timerState.remaining_ms);
  }

  const updated =
    new Date(timerState.updated_at).getTime();

  const elapsed =
    Date.now() - updated;

  return Math.max(
    0,
    Number(timerState.remaining_ms) - elapsed
  );
}


async function saveTimer(remaining, running) {

  const row = {
    id: "main",
    remaining_ms: Math.max(0, Math.round(remaining)),
    running: running,
    updated_at: new Date().toISOString()
  };

  const { error } =
    await supabaseClient
      .from("timers")
      .upsert(row);

  if (error) {
    console.error(error);
    document.getElementById("status").textContent =
      "Supabase error";
  }
}


async function startTimer() {

  const remaining =
    getCurrentRemaining();

  await saveTimer(
    remaining,
    true
  );
}


async function pauseTimer() {

  const remaining =
    getCurrentRemaining();

  await saveTimer(
    remaining,
    false
  );
}


async function addTime(amount) {

  const remaining =
    getCurrentRemaining();

  await saveTimer(
    remaining + amount,
    timerState.running
  );
}


async function resetTimer() {

  const time =
    parseTime(
      document.getElementById("time").value
    );

  await saveTimer(
    time,
    false
  );
}


async function setExactTime() {

  const value =
    document.getElementById("exactTime").value;

  const time =
    parseTime(value);

  await saveTimer(
    time,
    false
  );
}


function parseTime(value) {

  const parts =
    value.split(":").map(Number);

  if (parts.length === 2) {

    const minutes = parts[0] || 0;
    const seconds = parts[1] || 0;

    return (
      (minutes * 60 + seconds) *
      1000
    );
  }

  return 600000;
}


function generateTimer() {

  const paint =
    document.getElementById("paint").value.trim();

  const font =
    document.getElementById("font").value.trim();

  const size =
    document.getElementById("size").value;

  const time =
    document.getElementById("time").value;

  const base =
    window.location.href
      .substring(
        0,
        window.location.href.lastIndexOf("/") + 1
      );

  const url =
    base +
    "overlay.html" +
    "?paint=" +
    encodeURIComponent(paint) +
    "&font=" +
    encodeURIComponent(font) +
    "&size=" +
    encodeURIComponent(size) +
    "&start=" +
    encodeURIComponent(time) +
    "&room=main" +
    "&v=" +
    Date.now();

  document.getElementById("obsUrl").value = url;

  document.getElementById("output").style.display =
    "block";
}


function copyUrl() {

  const input =
    document.getElementById("obsUrl");

  navigator.clipboard.writeText(
    input.value
  );
}


supabaseClient
  .from("timers")
  .select("*")
  .eq("id", "main")
  .single()
  .then(({ data, error }) => {

    if (data) {
      timerState = data;
    }

    document.getElementById("status").textContent =
      "Connected";
  });


supabaseClient
  .channel("timer-sync")
  .on(
    "postgres_changes",
    {
      event: "*",
      schema: "public",
      table: "timers",
      filter: "id=eq.main"
    },
    payload => {

      if (payload.new) {
        timerState = payload.new;
      }

    }
  )
  .subscribe();


setInterval(() => {

  const remaining =
    getCurrentRemaining();

  if (
    timerState.running &&
    remaining <= 0
  ) {

    saveTimer(0, false);
  }

}, 500);

</script>

</body>
</html>
